 timestamps del IDE", "La carga cognitiva percibida"], "correct": 3, "exp": "NASA-TLX es un cuestionario subjetivo de carga cognitiva percibida, no una métrica automática de código."}, {"type": "single", "q": "El efecto Hawthorne ocurre porque los sujetos modifican su comportamiento:", "options": ["Únicamente en diseños between-subject", "Por saber que están siendo observados, independientemente del tratamiento", "Solo cuando el experimento dura más de una hora", "Debido al tratamiento experimental que reciben"], "correct": 1, "exp": "El efecto Hawthorne se debe al hecho de la observación en sí, no al tratamiento aplicado."}, {"type": "single", "q": "¿Cuál de las siguientes NO es una estrategia de control del efecto Hawthorne?", "options": ["Aumentar el tamaño de muestra a más de 100 sujetos", "Cegamiento parcial", "Período de habituación", "Medición no intrusiva mediante logs automáticos"], "correct": 0, "exp": "Aumentar la muestra no controla el efecto Hawthorne; las estrategias reales son habituación, cegamiento y medición no intrusiva."}, {"type": "single", "q": "El doble ciego completo, en la mayoría de experimentos IS:", "options": ["No suele ser posible, porque el sujeto sabe qué técnica está usando", "Nunca se discute como limitación en estudios IS", "Solo aplica cuando se usa un instrumento automático de medición", "Es el estándar habitual y sencillo de implementar"], "correct": 0, "exp": "En muchos experimentos IS el sujeto sabe qué técnica usa, impidiendo el doble ciego completo."}, {"type": "single", "q": "El cambio de versión de una herramienta de medición (ej. SonarQube) a mitad del experimento corresponde a la amenaza de validez de:", "options": ["Historia", "Difusión del tratamiento", "Instrumentación", "Maduración"], "correct": 2, "exp": "Un cambio en el instrumento de medición entre mediciones corresponde a la amenaza de instrumentación."}, {"type": "single", "q": "¿Qué diferencia hay entre las amenazas de 'maduración' y 'mortalidad experimental'?", "options": ["Maduración es la mejora natural de los sujetos con el tiempo; mortalidad experimental es el abandono de participantes durante el estudio", "Maduración se controla con NDA; mortalidad con aleatorización", "Son sinónimos; ambas se refieren al abandono de participantes", "Ambas solo aplican a experimentos de más de 6 meses"], "correct": 0, "exp": "Son amenazas distintas: mejora natural con el tiempo vs. abandono de participantes."}, {"type": "single", "q": "En un experimento IS, los datos cuantitativos y cualitativos se relacionan de la siguiente forma:", "options": ["Los cuantitativos son predominantes; los cualitativos complementan explicando el 'por qué'", "Ambos tipos de datos son mutuamente excluyentes en el mismo estudio", "Los cualitativos son predominantes; los cuantitativos complementarios", "Solo se permite un tipo de dato según el diseño usado"], "correct": 0, "exp": "Los datos cuantitativos predominan; los cualitativos complementan explicando el resultado."}, {"type": "single", "q": "En un diseño mixto, medir el 'qué' cuantitativo y complementar con una entrevista breve post-tarea fortalece principalmente:", "options": ["La validez estadística de conclusión", "La interpretación y la validez de constructo", "El cálculo de la potencia estadística", "La aleatorización de los sujetos"], "correct": 1, "exp": "Ese diseño mixto fortalece interpretación y validez de constructo, no la validez estadística ni la aleatorización."}, {"type": "single", "q": "Para lograr reproducibilidad en un experimento IS, es necesario contar con:", "options": ["Solo el consentimiento informado firmado por los participantes", "Únicamente la publicación del paper final en una revista de alto impacto", "El uso exclusivo de estadística no paramétrica", "Protocolo pre-registrado, datos abiertos y versiones de herramientas fijadas"], "correct": 3, "exp": "La reproducibilidad requiere protocolo pre-registrado, datos abiertos, pipeline reproducible y herramientas fijadas."}, {"type": "single", "q": "Frente al 'sesgo del experimentador' (interactuar diferente con cada grupo sin darse cuenta), la acción recomendada es:", "options": ["Aumentar el número de sujetos del grupo control", "Excluir del análisis a los sujetos con mayor confianza percibida", "Protocolizar las instrucciones con scripts estandarizados para cada grupo", "Cambiar de instrumento de medición a mitad del experimento"], "correct": 2, "exp": "La acción recomendada es estandarizar instrucciones mediante scripts, no ajustar muestra ni instrumento."}, {"type": "single", "q": "Frente a la contaminación entre grupos (sujetos que se comunican entre tratamientos distintos), la acción recomendada es:", "options": ["Ignorar el problema, ya que rara vez afecta los resultados", "Dar instrucción explícita de no compartir información y usar sesiones separadas", "Fusionar los grupos en uno solo para evitar el problema", "Aumentar la duración del experimento para diluir el efecto"], "correct": 1, "exp": "La acción recomendada es instrucción explícita más separación física o temporal de los grupos."}, {"type": "single", "q": "En un mini-experimento sobre revisión manual vs. checklist estructurado, las métricas que deben registrarse son:", "options": ["Salario del participante, años de experiencia, lenguaje preferido", "Nivel de significancia, tamaño del efecto, potencia estadística", "Número de defectos encontrados, tiempo real, confianza percibida", "Cobertura de pruebas, complejidad ciclomática, líneas de código"], "correct": 2, "exp": "Las tres métricas del mini-experimento son defectos encontrados, tiempo real y confianza percibida."}, {"type": "single", "q": "Un experimento sin protocolo detallado de ejecución:", "options": ["Existe una sola vez, en la mente del investigador", "Se considera automáticamente un cuasi-experimento válido", "No requiere consentimiento informado de los participantes", "Puede documentarse igualmente bien si el investigador es experimentado"], "correct": 0, "exp": "Sin protocolo detallado, el experimento no puede reconstruirse ni evaluarse por terceros."}, {"type": "single", "q": "En diseños within-subject, la técnica específica para aleatorizar el orden de los tratamientos se denomina:", "options": ["Muestreo intencional", "Contrabalanceo", "Bloques aleatorizados por experiencia previa", "Doble ciego completo"], "correct": 1, "exp": "El contrabalanceo es la técnica específica para aleatorizar el orden en diseños within-subject."}, {"type": "single", "q": "¿Qué diferencia hay entre 'datos faltantes' y 'abandono de participantes' como problemas durante la ejecución?", "options": ["Ambos se resuelven exclusivamente aumentando el tamaño de muestra", "Datos faltantes solo ocurren en between-subject; abandono solo en within-subject", "Son el mismo problema con nombres distintos", "Datos faltantes provienen de errores de instrumentos; abandono es la salida del estudio antes de completarlo"], "correct": 3, "exp": "Son dos problemas distintos: errores de medición vs. salida temprana del participante del estudio."}]}, {"key": "ex17", "title": "Reporte de Resultados en Experimentos IS", "group": "Experimentación", "questions": [{"type": "single", "q": "Según Ioannidis (2005), una de las causas de que 'la mayoría de los hallazgos publicados sean falsos' es:", "options": ["La falta de financiamiento para investigación", "El reporte selectivo, no solo el diseño del estudio", "Exclusivamente el fraude deliberado de los investigadores", "El uso excesivo de estadística no paramétrica"], "correct": 1, "exp": "Ioannidis destaca el reporte selectivo como parte del problema, no solo el diseño del estudio."}, {"type": "single", "q": "Según Kampenes et al. (2007), el porcentaje de artículos IS que omite el tamaño del efecto es:", "options": ["20%", "43%", "31%", "61%"], "correct": 3, "exp": "La cifra citada es 61%; 43% corresponde a no discutir amenazas a la validez."}, {"type": "single", "q": "Reportar únicamente 'los resultados mostraron que TDD fue mejor (p = 0.03)', sin más detalles, se considera un reporte:", "options": ["Incompleto, porque faltan estadística descriptiva, tamaño del efecto e intervalo de confianza", "Completo, porque incluye el valor p exacto", "Aceptable únicamente en revistas de bajo factor de impacto", "Ejemplar, siempre que p sea menor a 0.05"], "correct": 0, "exp": "Ese reporte es incompleto por faltar varios de los 5 elementos obligatorios del reporte."}, {"type": "single", "q": "¿Cuál de los siguientes NO es uno de los 5 elementos obligatorios de un reporte completo de resultados?", "options": ["El nombre del software usado para la recolección de datos", "Estadística descriptiva", "El intervalo de confianza", "El tamaño del efecto"], "correct": 0, "exp": "Los 5 elementos son estadística descriptiva, estadístico inferencial, p exacto, tamaño del efecto e intervalo de confianza; el nombre del software no es uno de ellos."}, {"type": "single", "q": "La mitigación 'múltiples métricas + operacionalización explícita' corresponde al tipo de validez de:", "options": ["Validez externa", "Validez interna", "Validez de constructo", "Validez de conclusión estadística"], "correct": 2, "exp": "Esa mitigación corresponde a validez de constructo (ejemplo: LOC ≠ productividad)."}, {"type": "single", "q": "Reportar una amenaza a la validez sin indicar su mitigación se considera:", "options": ["Irrelevante para la validez de conclusión estadística", "Una señal de paper débil", "Obligatorio únicamente en experimentos within-subject", "Una práctica aceptable, ya que basta con reconocer la limitación"], "correct": 1, "exp": "Amenazas sin mitigación son señal de debilidad del reporte, no una práctica suficiente."}, {"type": "single", "q": "¿Qué diferencia hay entre el 'pre-registro' y el 'replication package'?", "options": ["Ambos son opcionales y no afectan las citas del artículo", "El pre-registro se hace antes del experimento; el replication package se publica junto con el paper", "Son sinónimos; ambos ocurren después de publicar el paper", "El pre-registro incluye el código de análisis; el replication package solo la hipótesis"], "correct": 1, "exp": "El pre-registro es previo al experimento; el replication package acompaña la publicación."}, {"type": "single", "q": "Según Fernández et al. (2023), los artículos IS con replication package reciben:", "options": ["5 veces más citas", "Menos citas, por revelar limitaciones metodológicas", "2 veces más citas", "El mismo número de citas que los que no lo tienen"], "correct": 2, "exp": "La cifra citada es 2 veces más citas para artículos con replication package."}, {"type": "single", "q": "¿Cuál de los siguientes NO es uno de los errores que invalidan un reporte de experimento IS?", "options": ["Overclaiming", "HARKing", "Underclaiming", "Elegir un diseño factorial 2×2 en lugar de completamente aleatorizado"], "correct": 3, "exp": "Elegir un diseño factorial no es un error de reporte; los errores reales incluyen HARKing, underclaiming y overclaiming, entre otros."}, {"type": "single", "q": "Concluir 'TDD mejora la productividad en la industria' a partir de un estudio con 20 estudiantes es un ejemplo del error de:", "options": ["Overclaiming", "Underclaiming", "HARKing", "p-hacking"], "correct": 0, "exp": "Ese ejemplo corresponde a overclaiming: generalizar más allá del contexto real del estudio."}, {"type": "single", "q": "En la estructura IMRaD de un experimento, reportar solo el p-valor sin el tamaño del efecto es un error asociado específicamente a la sección de:", "options": ["Método", "Discusión", "Resultados", "Introducción"], "correct": 2, "exp": "Ese error se asocia a la sección de Resultados; HARKing a Introducción y overclaiming a Discusión."}, {"type": "single", "q": "Además de las secciones tradicionales de IMRaD, en el estándar actual se considera obligatorio de forma implícita:", "options": ["El Replication Package en Zenodo/OSF", "Un resumen ejecutivo de una página adicional", "Una traducción del abstract a tres idiomas", "Una sección de agradecimientos extendida"], "correct": 0, "exp": "El Replication Package se presenta como sección implícita obligatoria en el estándar actual."}, {"type": "single", "q": "En el ciclo de reporte abierto del caso NASA JWST, la publicación en MAST (Mikulski Archive for Space Telescopes) corresponde al paso de:", "options": ["Datos crudos", "Comunicación pública", "Preprint", "Pre-registro"], "correct": 0, "exp": "MAST corresponde al paso de datos crudos, publicados con DOI persistente."}, {"type": "single", "q": "Un experimento sobre herramientas de desarrollo en IS, respecto al ciclo de reporte abierto del caso NASA JWST:", "options": ["No puede seguir un ciclo similar, por tratarse de disciplinas distintas", "Puede seguir el mismo ciclo: datos → código → preprint → paper → comunicación", "No requiere ningún tipo de dataset abierto", "Solo puede publicarse en revistas especializadas en astronomía"], "correct": 1, "exp": "El mismo ciclo NASA es transferible al contexto de experimentos IS."}, {"type": "single", "q": "Al rechazar una observación de un revisor, la práctica recomendada es:", "options": ["Ignorar el comentario sin responder explícitamente", "Solicitar un nuevo revisor sin dar explicaciones", "Argumentar con referencias, no con opinión", "Aceptar siempre todas las observaciones, aunque no esté de acuerdo"], "correct": 2, "exp": "La recomendación es argumentar con referencias, no simplemente con opinión personal."}, {"type": "single", "q": "¿Cuál de los siguientes NO es un venue IS relevante para publicar experimentos, según lo señalado?", "options": ["EMSE", "ICSE", "ESEM", "Nature"], "correct": 3, "exp": "Nature no es un venue específico de Ingeniería de Software; ICSE, ESEM y EMSE sí lo son."}, {"type": "single", "q": "El peer review, en la conclusión presentada, se considera:", "options": ["Algo que debería evitarse publicando únicamente en preprints", "Solo relevante para experimentos con más de 100 sujetos", "Un obstáculo burocrático que retrasa innecesariamente la difusión científica", "El mecanismo que convierte resultados en conocimiento validado"], "correct": 3, "exp": "El peer review se presenta como el mecanismo que convierte resultados en conocimiento validado."}, {"type": "single", "q": "La sección Discussion de un reporte experimental debe incluir principalmente:", "options": ["Únicamente el valor p exacto y el tamaño del efecto", "Solo estadísticas descriptivas y una figura", "Interpretación en 3 niveles (estadístico/práctico/teórico) y amenazas con su mitigación", "Una revisión de literatura de al menos 10 referencias adicionales"], "correct": 2, "exp": "La sección Discussion exige interpretación en 3 niveles, amenazas con mitigación y una conclusión sin overclaiming."}, {"type": "single", "q": "Dentro de los criterios de evaluación de un reporte experimental, el mayor porcentaje se asigna a:", "options": ["Extensión del documento", "Reporte estadístico completo", "Número de referencias bibliográficas citadas", "Diseño gráfico de las figuras"], "correct": 1, "exp": "El reporte estadístico completo recibe el mayor peso relativo entre los criterios de evaluación."}, {"type": "single", "q": "La frase 'un experimento mal reportado es como un experimento no realizado' implica principalmente que:", "options": ["Basta con compartir los datos crudos sin necesidad de un reporte narrativo", "Solo los experimentos publicados en revistas de alto impacto cuentan como 'realizados'", "El diseño y la ejecución son las únicas etapas relevantes; el reporte es un trámite menor", "La transparencia en el reporte es parte constitutiva del método científico"], "correct": 3, "exp": "La transparencia en el reporte es parte constitutiva del método, no un paso opcional posterior."}]}, {"key": "ex18", "title": "Experimentación en IS: Problemas Reales", "group": "Experimentación", "questions": [{"type": "single", "q": "El experimento de Erdogmus, Morisio & Favaro (2005), replicado más de 20 veces, comparó TDD vs. ITL usando un diseño:", "options": ["Within-subject con 24 estudiantes de posgrado", "Cuasi-experimento de campo sin aleatorización", "Between-subject con 100 profesionales de la industria", "Experimento de simulación sin sujetos humanos"], "correct": 0, "exp": "El diseño fue within-subject con 24 estudiantes de posgrado, cada uno realizando ambos tratamientos."}, {"type": "single", "q": "En el experimento de Erdogmus et al. (2005), ¿qué variable mostró diferencia estadísticamente significativa entre TDD e ITL?", "options": ["Tanto defectos como tiempo de desarrollo", "Ninguna de las dos variables", "El número de defectos, pero no el tiempo de desarrollo", "Solo el tiempo de desarrollo"], "correct": 2, "exp": "Hubo diferencia significativa en defectos, pero no en tiempo de desarrollo."}, {"type": "single", "q": "Según las réplicas posteriores a Erdogmus et al., el efecto de TDD depende principalmente de:", "options": ["El lenguaje de programación usado", "El tamaño de la empresa donde se aplique", "El tipo de IDE utilizado", "La experiencia del desarrollador"], "correct": 3, "exp": "El efecto depende de la experiencia del desarrollador, limitando la validez externa a desarrolladores novatos."}, {"type": "single", "q": "En el experimento de Peng et al. (2023) sobre GitHub Copilot (tarea HTTP Server), el grupo con Copilot completó la tarea:", "options": ["43.8% más rápido que el control (d = 0.89)", "En el mismo tiempo que el grupo control", "Más lento que el grupo control", "El experimento no midió tiempo, solo calidad del código"], "correct": 0, "exp": "El grupo Copilot fue 43.8% más rápido, con un tamaño del efecto d = 0.89."}, {"type": "single", "q": "El contraexperimento de Imai (2022) sobre Copilot encontró que:", "options": ["Copilot genera código más rápido, pero con más vulnerabilidades de seguridad", "Copilot reduce tanto el tiempo de desarrollo como las vulnerabilidades de seguridad", "Copilot elimina por completo las vulnerabilidades conocidas", "Copilot no tiene ningún efecto medible sobre tiempo ni seguridad"], "correct": 0, "exp": "Imai (2022) encontró código más rápido pero con más vulnerabilidades (CWE)."}, {"type": "single", "q": "La lección clave de contrastar Peng et al. (2023) con Imai (2022) sobre Copilot es que:", "options": ["La seguridad del código nunca puede medirse experimentalmente", "Ambos estudios son irrelevantes por usar metodologías distintas", "Solo el tiempo de finalización es una variable dependiente válida", "La operacionalización de la variable dependiente determina el resultado"], "correct": 3, "exp": "La lección clave es que definir qué variable dependiente se mide (y por qué) determina el resultado obtenido."}, {"type": "single", "q": "En el experimento NASA F Prime vs. sistema legado (fault injection testing), F Prime obtuvo una tasa de recuperación de:", "options": ["97%, idéntica al sistema legado", "99.7%, mayor que el sistema legado", "El experimento no reportó porcentajes de recuperación", "94.2%, menor que el sistema legado"], "correct": 1, "exp": "F Prime obtuvo 99.7% frente a 94.2% del sistema legado, lo que llevó a adoptarlo para Ingenuity."}, {"type": "single", "q": "En el proceso de convertir un problema práctico en experimento, definir la hipótesis falsificable (H0/H1) ocurre:", "options": ["Después de recolectar los datos", "Después de pre-registrar el estudio en OSF", "Antes de identificar el problema práctico", "Después de formular la pregunta experimental (GQM)"], "correct": 3, "exp": "La hipótesis se define después de formular la pregunta GQM, y antes del pre-registro."}, {"type": "single", "q": "En un ejemplo de comparación entre revisión manual y SonarQube (45 min promedio, 60% de bugs detectados), la H1 formulada establece que:", "options": ["La revisión manual detecta más defectos por hora que SonarQube", "SonarQube detecta más defectos por hora que la revisión manual", "No existe diferencia posible entre ambos métodos", "El tiempo de revisión no puede medirse experimentalmente"], "correct": 1, "exp": "La H1 del ejemplo establece que SonarQube detecta más defectos por hora que la revisión manual."}, {"type": "single", "q": "La pregunta '¿mejora Copilot la velocidad en la industria real?' corresponde metodológicamente a:", "options": ["Minería de repositorios (MSR) exclusivamente", "Experimento controlado, porque siempre es posible aleatorizar en cualquier empresa", "Cuasi-experimento, porque no siempre es posible aleatorizar en contextos empresariales reales", "Estudio de caso exploratorio exclusivamente"], "correct": 2, "exp": "Al no poder aleatorizarse completamente en un contexto empresarial real, corresponde a cuasi-experimento."}, {"type": "single", "q": "Lo que determina el método de investigación correcto para una pregunta IS es:", "options": ["El número de publicaciones previas sobre el tema", "El presupuesto disponible para el estudio", "La preferencia personal del investigador", "La naturaleza de la pregunta de investigación"], "correct": 3, "exp": "El método lo determina la pregunta, no la preferencia ni la facilidad de implementación."}, {"type": "single", "q": "Frente al obstáculo 'no consigo 30 desarrolladores' para un experimento, la solución propuesta es:", "options": ["Cancelar el experimento y reformularlo como encuesta", "Duplicar artificialmente las respuestas de cada sujeto", "Un diseño within-subject, donde cada sujeto actúa como su propio control", "Sustituir a los desarrolladores por estudiantes de carreras no relacionadas"], "correct": 2, "exp": "Un diseño within-subject permite obtener resultados publicables con un número menor de sujetos."}, {"type": "single", "q": "Frente al obstáculo 'mis sujetos son estudiantes, no profesionales', citando a Carver (2010), la recomendación es:", "options": ["Aleatorizar estudiantes y profesionales en el mismo grupo sin distinguirlos", "Reportar explícitamente la limitación y planear replicación con profesionales", "Ocultar en el paper que los sujetos eran estudiantes", "Descartar el experimento por completo"], "correct": 1, "exp": "La recomendación es transparencia sobre la limitación, validez para fenómenos de aprendizaje, y replicación futura."}, {"type": "single", "q": "En el ciclo completo de investigación experimental, la relación entre el reporte y nuevas preguntas es que:", "options": ["El reporte genera nuevas preguntas, que originan un nuevo experimento", "El reporte reemplaza la necesidad de ejecutar experimentos futuros sobre el mismo tema", "El reporte es la etapa final; el ciclo termina ahí sin generar nuevas preguntas", "El reporte solo es necesario si el resultado fue estadísticamente significativo"], "correct": 0, "exp": "El ciclo se repite: el reporte genera nuevas preguntas que originan nuevos experimentos."}, {"type": "single", "q": "La frase adaptada sobre teoría y práctica establece el orden correcto:", "options": ["Ambas versiones son equivalentes", "La práctica sin la teoría es vacía; la teoría sin la práctica es ciega", "La teoría sin la práctica es vacía; la práctica sin la teoría es ciega", "La cita original es de Popper, no de Kant"], "correct": 2, "exp": "El orden correcto es: la teoría sin la práctica es vacía; la práctica sin la teoría es ciega."}, {"type": "single", "q": "En un proyecto final de experimentación IS predominantemente cuantitativo, ¿cuál de los siguientes elementos NO correspondería incluir?", "options": ["Codificación abierta, axial y selectiva de entrevistas cualitativas", "Ejecución documentada con instrumentos y protocolo de anonimización", "Reporte IMRaD siguiendo un checklist de reporte estadístico", "Protocolo pre-registrado con pregunta GQM, hipótesis y plan de análisis"], "correct": 0, "exp": "La codificación cualitativa (Strauss & Corbin) pertenece a la unidad de Estudios de Caso, no a un proyecto experimental cuantitativo."}, {"type": "single", "q": "Entre las sugerencias de problemas reales IS en Ecuador para un proyecto de experimentación, se incluye:", "options": ["¿Cuántas empresas ecuatorianas cotizan en la Bolsa de Valores de Guayaquil?", "¿Cuál es el salario promedio de un desarrollador junior en Ecuador?", "¿Qué framework de backend es más popular entre desarrolladores ecuatorianos?", "¿Pair programming mejora la calidad del código en equipos de startups quiteñas?"], "correct": 3, "exp": "Esa pregunta, formulada como comparación manipulable de una técnica, es la sugerida como problema experimental."}, {"type": "single", "q": "Respecto a quién puede hacer experimentación rigurosa en IS, la posición correcta es que:", "options": ["Es un privilegio exclusivo de organizaciones con grandes recursos como la NASA o el MIT", "Es un método accesible que convierte una intuición de desarrollador en conocimiento verificable", "Requiere obligatoriamente un equipo de más de 10 investigadores", "Solo aplica en proyectos financiados por el gobierno"], "correct": 1, "exp": "La experimentación rigurosa se presenta como un método accesible, no un privilegio exclusivo de grandes instituciones."}, {"type": "single", "q": "Una pregunta de investigación adecuada para un experimento IS debe permitir principalmente:", "options": ["Evaluarse únicamente mediante entrevistas semiestructuradas", "Manipular una variable independiente y medir su efecto bajo algún control", "Responder con datos históricos de repositorios sin ninguna manipulación", "Formularse exclusivamente como opinión, sin necesidad de datos"], "correct": 1, "exp": "Debe permitir manipular una VI y medir su efecto sobre una VD bajo algún grado de control."}, {"type": "single", "q": "Al comparar los casos de Erdogmus/TDD, Peng-Imai/Copilot y NASA F Prime, lo que comparten como parte de un experimento bien ejecutado es:", "options": ["Los tres evitaron deliberadamente reportar el tamaño del efecto", "Ninguno de los tres reportó amenazas a la validez", "Los tres definieron variables independientes y dependientes claras, con comparación controlada y resultados cuantificados", "Los tres se realizaron exclusivamente con estudiantes de pregrado"], "correct": 2, "exp": "Los tres comparten VI/VD claras, comparación controlada y resultados cuantificados (con tamaño del efecto o porcentajes)."}]}, {"key": "parcial3", "title": "Prueba Parcial 3 (ESPE) · Examen Real Reconstruido — 40 preguntas", "group": "Examen Real", "questions": [{"type": "single", "q": "1. Según Weinberg & Schulman, ¿en qué año se registra la primera referencia a experimentos controlados en Ingeniería de Software (relacionada con la legibilidad de código)?", "options": ["1971", "1995", "1986", "1965"], "correct": 0, "exp": "1971 es la fecha citada como primera referencia a experimentos controlados en IS, antes de Basili & Selby (1986)."}, {"type": "single", "q": "2. El experimento de Basili & Selby (1986), considerado el primer experimento IS con diseño riguroso, comparó distintos métodos de detección de defectos. ¿Cuál de los siguientes métodos NO formó parte de esa comparación?", "options": ["Inspección de código", "Pruebas funcionales", "Pruebas estructurales", "Programación en pares (pair programming)"], "correct": 3, "exp": "Basili & Selby (1986) compararon inspección de código, pruebas funcionales y estructurales. El pair programming se popularizó después, con XP."}, {"type": "single", "q": "3. El período 1995-2000, en el que Wohlin, Runeson, Höst y otros publican \"Experimentation in Software Engineering\", se caracteriza principalmente por:", "options": ["La crisis de reproducibilidad en la disciplina", "La aparición de los primeros experimentos sobre TDD", "La sistematización formal del método experimental en IS", "El surgimiento de los experimentos con IA generativa"], "correct": 2, "exp": "Ese libro representa la sistematización formal del método experimental en IS."}, {"type": "single", "q": "4. De acuerdo con la definición de Wohlin et al. (2012), ¿cuál de los siguientes NO es un elemento necesario para que un estudio empírico se considere un experimento?", "options": ["Manipulación activa de al menos una variable independiente", "Condiciones controladas que minimicen variables de confusión", "Observación pasiva de datos ya ocurridos", "Medición de resultados con métricas definidas antes del estudio"], "correct": 2, "exp": "La observación pasiva de datos ya ocurridos describe MSR o un estudio de caso, no un experimento."}, {"type": "single", "q": "5. Según los criterios de Wohlin et al., ¿cuál de las siguientes opciones NO constituye un experimento?", "options": ["Un diseño factorial 2×2 con dos tratamientos", "Un estudio de caso sobre la adopción de integración continua en una empresa", "Un experimento de simulación con modelos artificiales", "Un experimento controlado con aleatorización de sujetos"], "correct": 1, "exp": "El estudio de caso no manipula variables, por lo tanto no es un experimento."}, {"type": "single", "q": "6. Un investigador desea responder: \"¿Qué factores predicen los defectos en proyectos de código abierto?\". Según la tabla de métodos de investigación, el método más adecuado es:", "options": ["Encuesta", "Minería de repositorios (MSR)", "Experimento controlado", "Cuasi-experimento"], "correct": 1, "exp": "Esa pregunta se responde minando datos históricos existentes de repositorios, sin manipular variables."}, {"type": "single", "q": "7. ¿Cuál de las siguientes NO es una condición apropiada para usar un experimento controlado en IS?", "options": ["Se busca establecer causalidad (X causa Y)", "Se dispone de suficientes sujetos para formar grupos", "El fenómeno puede reproducirse en condiciones controladas", "No es posible manipular la variable independiente"], "correct": 3, "exp": "Si no es posible manipular la variable independiente, precisamente no se puede hacer un experimento."}, {"type": "single", "q": "8. Un cuasi-experimento se distingue de un experimento controlado principalmente porque:", "options": ["No mide variables dependientes", "No hay aleatorización completa y se usan grupos naturales existentes", "Se ejecuta exclusivamente en laboratorio", "No permite ningún tipo de control de variables"], "correct": 1, "exp": "El cuasi-experimento sí mide variables y permite cierto control; lo distintivo es la ausencia de aleatorización completa."}, {"type": "single", "q": "9. ¿Cuál de los siguientes NO es un reto reconocido de la experimentación en Ingeniería de Software?", "options": ["Exceso de replicaciones que satura la literatura", "Variables de confusión difíciles de controlar", "El efecto Hawthorne", "Escasez de sujetos representativos de la industria"], "correct": 0, "exp": "El reto real es la escasa replicación ('crisis de reproducibilidad'), no un exceso de replicaciones."}, {"type": "single", "q": "10. El \"efecto Hawthorne\", mencionado como un reto de la experimentación en IS, se refiere a que:", "options": ["El investigador introduce sesgos al analizar los datos", "Los sujetos se fatigan al repetir la misma tarea dos veces", "Los resultados varían según la hora del día en que se ejecuta la tarea", "Los sujetos actúan de forma diferente por saber que están siendo observados"], "correct": 3, "exp": "El efecto Hawthorne es el cambio de comportamiento por saberse observado, no por el tratamiento en sí."}, {"type": "single", "q": "11. En el caso del software F Prime de la NASA (usado en el helicóptero Ingenuity en Marte), ¿cuál de las siguientes NO fue una técnica experimental aplicada antes del lanzamiento?", "options": ["Encuestas de satisfacción a los ingenieros de vuelo", "Pruebas de regresión automatizadas (más de 2,000 casos)", "Experimentos de inyección de fallos para medir la recuperación del sistema", "Comparaciones experimentales entre versiones del software en condiciones simuladas"], "correct": 0, "exp": "Las técnicas reales fueron regresión automatizada, inyección de fallos y comparaciones entre versiones; no se mencionan encuestas de satisfacción."}, {"type": "single", "q": "12. Respecto al balance entre control y naturalismo en el diseño experimental, la regla general establece que:", "options": ["El control y el naturalismo son independientes entre sí", "A mayor naturalismo, mayor certeza causal", "A mayor control del entorno, mayor validez interna (certeza causal)", "A mayor control del entorno, mayor validez externa"], "correct": 2, "exp": "Mayor control → mayor validez interna; mayor naturalismo → mayor validez externa."}, {"type": "single", "q": "13. En la revisión de Hannay et al. (2013) sobre 113 experimentos IS publicados en ICSE y FSE, ¿cuál de las siguientes cifras NO corresponde a los hallazgos reales reportados?", "options": ["27% no documentaba el procedimiento de aleatorización", "38% tenía hipótesis ambiguas o ausentes", "60% no incluía ninguna variable dependiente", "19% no reportaba el tamaño del efecto, solo el p-valor"], "correct": 2, "exp": "Las cifras reales son 38%, 27% y 19%. El 60% sobre variable dependiente no aparece en el material."}, {"type": "single", "q": "14. Según la plantilla GQM (Goal-Question-Metric) de Basili et al. (1994), el orden correcto de la estructura del objetivo es:", "options": ["Hipótesis → Variables → Diseño → Instrumentos", "Analizar [objeto] → con el propósito de [intención] → con respecto a [aspecto de calidad] → desde el punto de vista de [perspectiva] → en el contexto de [entorno]", "Métrica → Pregunta → Objetivo", "Contexto → Perspectiva → Intención → Objeto"], "correct": 1, "exp": "Ese es el orden exacto de la plantilla GQM."}, {"type": "single", "q": "15. Según Wohlin et al. (2012), ¿cuál de los siguientes NO es uno de los 5 componentes del diseño experimental que deben quedar definidos antes de ejecutar el experimento?", "options": ["Objetivo (GQM)", "Instrumentos de recolección de datos", "Hipótesis", "Publicación anticipada de los resultados esperados"], "correct": 3, "exp": "Publicar anticipadamente los resultados esperados no es un componente real; sería contrario al pre-registro correcto."}, {"type": "single", "q": "16. La hipótesis nula (H0) en un experimento IS afirma que:", "options": ["Existe una diferencia significativa entre los grupos", "La variable dependiente causa cambios en la variable independiente", "El tamaño del efecto es necesariamente grande", "No existe diferencia ni efecto entre los grupos comparados"], "correct": 3, "exp": "H0 = no hay diferencia ni efecto. La existencia de diferencia significativa describe H1, no H0."}, {"type": "single", "q": "17. Una hipótesis alternativa que afirma específicamente \"el grupo A presenta menor densidad de defectos que el grupo B\" (en lugar de simplemente \"A ≠ B\") se clasifica como:", "options": ["Direccional (una cola)", "No falsificable", "Bidireccional (dos colas)", "Nula"], "correct": 0, "exp": "Especificar la dirección de la diferencia convierte la hipótesis en direccional (una cola)."}, {"type": "single", "q": "18. ¿Cuál de las siguientes afirmaciones sobre la formulación de hipótesis en IS es INCORRECTA?", "options": ["Una hipótesis que no puede refutarse con datos es una creencia, no una hipótesis científica", "Una hipótesis científica debe ser falsificable, según el criterio de Popper", "Las hipótesis pueden formularse libremente después del análisis, sin afectar la validez del estudio", "Formular la hipótesis después de observar los datos se conoce como HARKing y es un error frecuente"], "correct": 2, "exp": "Formular hipótesis después del análisis sí afecta la validez del estudio: es precisamente el HARKing."}, {"type": "single", "q": "19. En un experimento sobre TDD vs. desarrollo tradicional, la variable que el investigador manipula deliberadamente (el tratamiento) se denomina:", "options": ["Variable de confusión", "Variable dependiente", "Variable independiente", "Variable moderadora"], "correct": 2, "exp": "La variable manipulada deliberadamente por el investigador es, por definición, la variable independiente."}, {"type": "single", "q": "20. En un experimento que mide la densidad de defectos comparando TDD vs. desarrollo tradicional, ¿cuál de las siguientes NO sería un ejemplo apropiado de variable controlada?", "options": ["IDE utilizado por los sujetos", "Lenguaje de programación utilizado", "Tiempo asignado para completar la tarea", "Densidad de defectos obtenida"], "correct": 3, "exp": "La densidad de defectos es la variable DEPENDIENTE (lo que se mide), no una variable controlada."}, {"type": "single", "q": "21. Una variable que \"modifica la relación entre la variable independiente y la dependiente\", como el tamaño del equipo o la complejidad del sistema, se denomina:", "options": ["Variable moderadora", "Variable dependiente", "Variable de confusión", "Variable controlada"], "correct": 0, "exp": "Una variable moderadora afecta la fuerza o dirección de la relación VI-VD."}, {"type": "single", "q": "22. Según Carver et al. (2010), la estrategia recomendada para la selección de sujetos en experimentos IS es:", "options": ["Usar exclusivamente sistemas automatizados sin sujetos humanos", "Comenzar con estudiantes para validar el diseño y luego replicar con profesionales", "Usar exclusivamente profesionales desde el primer experimento", "Evitar cualquier tipo de replicación posterior"], "correct": 1, "exp": "Carver et al. (2010) recomiendan estudiantes primero (validar diseño), profesionales después (validar generalización)."}, {"type": "single", "q": "23. Respecto al uso de estudiantes como sujetos experimentales frente a profesionales, ¿cuál de las siguientes afirmaciones es INCORRECTA?", "options": ["Los sistemas (objetos) no representan el factor humano, pero no tienen fatiga ni sesgos cognitivos", "Los profesionales son más difíciles de reclutar y tienen tiempo limitado", "Los estudiantes ofrecen mayor validez externa que los profesionales", "Los estudiantes ofrecen mayor disponibilidad y homogeneidad"], "correct": 2, "exp": "Es al revés: los profesionales ofrecen mayor validez externa que los estudiantes, no lo contrario."}, {"type": "single", "q": "24. Sobre el diseño within-subject (medidas repetidas), ¿cuál de las siguientes afirmaciones es INCORRECTA?", "options": ["Requiere contrabalanceo para controlar el efecto del orden de los tratamientos", "Elimina la variabilidad entre sujetos", "El mismo sujeto realiza ambos tratamientos, en orden aleatorio", "Está completamente libre de riesgo de efectos de aprendizaje o fatiga"], "correct": 3, "exp": "El within-subject reduce, pero NO elimina, el riesgo de efectos de aprendizaje o fatiga; por eso requiere contrabalanceo."}, {"type": "single", "q": "25. Un diseño factorial 2×2, en el que se estudian simultáneamente el factor \"TDD vs. tradicional\" y el factor \"pair vs. solo programming\", permite principalmente:", "options": ["Detectar interacciones entre los dos factores estudiados", "Reducir a la mitad el número de sujetos necesarios", "Evitar el uso de pruebas estadísticas posteriores", "Eliminar por completo la necesidad de aleatorización"], "correct": 0, "exp": "La ventaja distintiva de un diseño factorial es detectar interacciones entre factores."}, {"type": "single", "q": "26. El diseño de bloques aleatorizados, en el que se agrupan sujetos similares antes de aleatorizar dentro de cada bloque, tiene como propósito principal:", "options": ["Reducir el efecto de la variabilidad entre sujetos", "Aumentar artificialmente el tamaño de la muestra", "Eliminar la necesidad de un grupo control", "Detectar interacciones entre múltiples factores"], "correct": 0, "exp": "Agrupar sujetos similares en bloques reduce el ruido causado por su variabilidad."}, {"type": "single", "q": "27. El plan de análisis estadístico, que debe definirse ANTES de recolectar los datos para evitar el p-hacking, debe incluir todos los siguientes EXCEPTO:", "options": ["El nivel de significancia (α), habitualmente 0.05 en IS", "El tipo de prueba estadística (paramétrica o no paramétrica)", "El valor exacto de p que se espera obtener", "El tamaño del efecto esperado y la potencia estadística necesaria"], "correct": 2, "exp": "No se puede predecir de antemano el valor exacto de p que arrojarán los datos; eso no forma parte del plan de análisis."}, {"type": "single", "q": "28. La potencia estadística (comúnmente fijada en β = 0.80) se utiliza en el diseño experimental para determinar:", "options": ["El tipo de prueba paramétrica que debe aplicarse", "El tamaño del efecto observado tras el análisis", "El nivel de significancia adecuado para el estudio", "Cuántos sujetos se necesitan para detectar el efecto, si este realmente existe"], "correct": 3, "exp": "La potencia estadística determina, junto con el tamaño del efecto esperado y α, el tamaño de muestra necesario."}, {"type": "single", "q": "29. Si un experimento IS no cuenta con potencia estadística suficiente, el riesgo principal es:", "options": ["Sobreestimar sistemáticamente el tamaño del efecto", "Generar automáticamente resultados de p-hacking", "Cometer un error tipo II (no detectar un efecto que realmente existe)", "Cometer un error tipo I (falso positivo)"], "correct": 2, "exp": "Potencia insuficiente aumenta el riesgo de error tipo II."}, {"type": "single", "q": "30. ¿Qué herramienta se menciona específicamente para el cálculo de la potencia estadística y el tamaño de muestra necesario antes de ejecutar un experimento?", "options": ["G*Power", "JASP", "SonarQube", "R"], "correct": 0, "exp": "G*Power es la herramienta específica para cálculo de potencia."}, {"type": "single", "q": "31. Según el proceso de análisis de datos en experimentos IS, el primer paso a realizar es:", "options": ["Verificar los supuestos estadísticos (normalidad y homogeneidad de varianzas)", "Inspeccionar y limpiar los datos (outliers, datos faltantes, distribuciones)", "Calcular el tamaño del efecto (d de Cohen)", "Aplicar la prueba de hipótesis seleccionada"], "correct": 1, "exp": "El orden correcto es: inspeccionar/limpiar datos, verificar supuestos, aplicar la prueba, calcular el tamaño del efecto."}, {"type": "single", "q": "32. La prueba de Shapiro-Wilk, aplicada antes de seleccionar la prueba de hipótesis, sirve para verificar:", "options": ["El tamaño del efecto", "Si los datos siguen una distribución normal", "La igualdad de varianzas entre grupos", "La potencia estadística del diseño"], "correct": 1, "exp": "Shapiro-Wilk prueba normalidad; la igualdad de varianzas la prueba Levene."}, {"type": "single", "q": "33. La prueba de Levene, complementaria a Shapiro-Wilk en el análisis de datos IS, se utiliza para verificar:", "options": ["La aleatorización de los sujetos", "La igualdad de varianzas entre los grupos comparados", "La normalidad de los datos", "El tamaño del efecto observado"], "correct": 1, "exp": "Levene prueba homogeneidad de varianzas entre los grupos comparados."}, {"type": "single", "q": "34. Para comparar dos grupos independientes cuyos datos NO siguen una distribución normal, la prueba estadística recomendada es:", "options": ["Mann-Whitney U", "t-test de medidas repetidas", "ANOVA de un factor", "t-test de Student"], "correct": 0, "exp": "Mann-Whitney U es la prueba no paramétrica estándar para 2 grupos independientes con datos no normales."}, {"type": "single", "q": "35. Para un diseño con 3 o más grupos independientes cuyos datos SÍ siguen una distribución normal, la prueba recomendada es:", "options": ["Mann-Whitney U", "Kruskal-Wallis", "ANOVA de un factor", "Wilcoxon signed-rank"], "correct": 2, "exp": "ANOVA de un factor es la prueba paramétrica para 3+ grupos independientes con datos normales."}, {"type": "single", "q": "36. ¿Cuál de las siguientes NO es una prueba estadística no paramétrica?", "options": ["Wilcoxon signed-rank (para 2 medidas del mismo sujeto)", "t-test de Student (para 2 grupos independientes)", "Kruskal-Wallis (para 3+ grupos independientes)", "Mann-Whitney U (para 2 grupos independientes)"], "correct": 1, "exp": "El t-test de Student es una prueba PARAMÉTRICA (requiere normalidad); las otras tres son no paramétricas."}, {"type": "single", "q": "37. Cuando existen variables de confusión que se desean controlar estadísticamente en un diseño con datos de distribución normal, la prueba adecuada es:", "options": ["ANCOVA (análisis de covarianza)", "MANOVA", "Regresión logística", "Prueba de Chi-cuadrado"], "correct": 0, "exp": "ANCOVA combina ANOVA con regresión para controlar estadísticamente el efecto de covariables."}, {"type": "single", "q": "38. Según la clasificación del tamaño del efecto mediante la d de Cohen usada en experimentos IS, un valor de d = 0.65 corresponde a un efecto:", "options": ["Mediano (0.20 ≤ d < 0.50)", "Pequeño (d < 0.20)", "No interpretable sin el p-valor", "Grande (d ≥ 0.50), relevante para la práctica"], "correct": 3, "exp": "d = 0.65 cae en el rango 'grande' (d ≥ 0.50), independientemente del p-valor."}, {"type": "single", "q": "39. ¿Cuál de las siguientes afirmaciones sobre el p-valor es INCORRECTA?", "options": ["Depende del tamaño de la muestra: con muestras muy grandes, diferencias mínimas pueden resultar \"significativas\"", "Siempre coincide exactamente con el tamaño del efecto obtenido", "Un resultado puede ser estadísticamente significativo pero prácticamente irrelevante (p. ej., p=0.03 con d=0.12)", "No indica cuán grande es la diferencia en términos prácticos (tamaño del efecto)"], "correct": 1, "exp": "El p-valor nunca coincide automáticamente con el tamaño del efecto; son medidas distintas e independientes."}, {"type": "single", "q": "40. ¿Cuál de los siguientes NO se identifica como un error común en el análisis de datos de experimentos IS?", "options": ["Practicar p-hacking: ejecutar múltiples análisis hasta obtener p < 0.05", "Confundir significancia estadística con relevancia práctica", "Reportar solo el p-valor, sin el tamaño del efecto ni el intervalo de confianza", "Verificar siempre los supuestos con Shapiro-Wilk antes de aplicar una prueba"], "correct": 3, "exp": "Verificar los supuestos antes de elegir la prueba es, en realidad, una BUENA práctica, no un error."}]}, {"key": "final", "title": "Examen Final Integrador · Unidad 3: Métodos Empíricos en IS", "group": "Integrador", "questions": [{"type": "single", "q": "Un investigador pregunta: '¿el pair programming reduce los defectos en un equipo específico de una fintech quiteña, y por qué ese equipo lo adoptó?' El método adecuado, dado el patrón 'cómo/por qué' con contexto real específico, es:", "options": ["Encuesta", "Estudio de caso", "Experimento controlado", "Minería de repositorios (MSR)"], "correct": 1, "exp": "El patrón 'cómo/por qué' con contexto real específico corresponde a estudio de caso."}, {"type": "single", "q": "La generalización que busca un experimento y la que busca un estudio de caso se diferencian en que:", "options": ["Ambos buscan exactamente el mismo tipo de generalización estadística", "El experimento puede buscar generalización estadística; el estudio de caso busca generalización analítica o teórica", "El estudio de caso busca generalización estadística; el experimento no generaliza", "Ninguno de los dos métodos permite ningún tipo de generalización"], "correct": 1, "exp": "Es una distinción central: generalización estadística (experimento) vs. analítica/teórica (estudio de caso)."}, {"type": "single", "q": "La diferencia central entre una 'proposición' de un estudio de caso y una 'hipótesis' de un experimento es que:", "options": ["La proposición orienta qué observar en un fenómeno no controlado; la hipótesis se prueba estadísticamente con variables manipuladas", "La proposición requiere cálculo de potencia estadística; la hipótesis no", "La hipótesis se usa solo en estudios exploratorios; la proposición solo en explicativos", "No hay diferencia real; son el mismo concepto con distinto nombre"], "correct": 0, "exp": "Cada método usa una herramienta acorde a su lógica: orientación interpretativa vs. prueba estadística falsable."}, {"type": "single", "q": "Rico (2024) y Kitchenham et al. (2009), aunque analizan métodos distintos (estudio de caso y experimento), coinciden en una misma crítica de fondo:", "options": ["Que solo los estudios financiados por la industria tienen buena calidad metodológica", "Que ambos métodos deberían eliminarse en favor exclusivo de la encuesta", "Que la literatura IS tiene demasiados datos cuantitativos y pocos cualitativos", "Que gran parte de los estudios publicados carecen de suficiente documentación para ser evaluados o replicados"], "correct": 3, "exp": "Ambos autores documentan, desde ángulos distintos, el mismo problema: documentación insuficiente para el rigor científico."}, {"type": "single", "q": "Los casos NASA GeneLab (estudio de caso) y NASA F Prime/Ingenuity (experimento) comparten el mismo principio de:", "options": ["Evitar deliberadamente compartir datos abiertos por seguridad", "No requerir ningún tipo de rigor metodológico formal", "Aplicar exclusivamente estadística inferencial a sus resultados", "Documentación reproducible antes de comunicar resultados como confiables"], "correct": 3, "exp": "Ambos casos NASA ilustran el mismo principio: apertura y documentación reproducible como base de credibilidad."}, {"type": "single", "q": "Un investigador pregunta '¿qué porcentaje de empresas de software en Quito usa integración continua?'. El método que NO debería usar es:", "options": ["Ninguno de los anteriores; los tres son igualmente válidos", "Estudio de caso explicativo", "Encuesta", "Minería de repositorios (MSR), si hay datos públicos disponibles"], "correct": 1, "exp": "Preguntas de 'qué porcentaje' apuntan a encuesta o MSR, no a estudio de caso explicativo (que responde 'cómo/por qué')."}, {"type": "single", "q": "El error análogo al HARKing, pero en estudios de caso (en lugar de experimentos), consiste en:", "options": ["No existe ningún error análogo; los estudios de caso no usan proposiciones formales", "Formular proposiciones después de ver los datos y presentarlas como si hubieran guiado el diseño desde el inicio", "Usar member checking sin consentimiento informado", "Calcular el tamaño del efecto sin haber verificado normalidad"], "correct": 1, "exp": "El principio de pre-registro (no ajustar el diseño tras ver los datos) es transversal a ambos métodos."}, {"type": "single", "q": "La 'validez interna' se protege de forma distinta en cada método porque:", "options": ["En el experimento se protege con aleatorización y control; en el estudio de caso con análisis de explicaciones rivales, ya que este último no manipula variables", "Ambos métodos usan exactamente las mismas herramientas para proteger la validez interna", "La validez interna solo se protege mediante el cálculo del valor p", "Solo el experimento puede proteger su validez interna; el estudio de caso no tiene ese concepto"], "correct": 0, "exp": "Cada método usa herramientas propias de su lógica: manipulación controlada vs. análisis interpretativo riguroso."}, {"type": "single", "q": "Los cuatro tipos de validez de Yin (2014) para estudios de caso tienen un paralelo en el marco de validez de Wohlin et al. (2012) para experimentos. Esto muestra que:", "options": ["Ambos métodos comparten un marco general de validez, con mitigaciones distintas según su lógica", "Son categorías exclusivas del estudio de caso, sin ningún paralelo experimental", "Ningún método discute tipos de validez de forma explícita", "Los experimentos solo se preocupan por la validez estadística, ignorando las demás"], "correct": 0, "exp": "Ambas unidades usan un marco de validez estructuralmente paralelo, adaptado a la lógica de cada método."}, {"type": "single", "q": "El estudio de caso sobre Copilot en equipos ágiles y los experimentos de Peng et al. (2023) e Imai (2022) sobre Copilot ilustran una relación de:", "options": ["Exclusión mutua; solo uno de los dos métodos puede ser válido para estudiar Copilot", "Ninguna relación; se trata de fenómenos completamente distintos", "Redundancia total; ambos métodos llegan exactamente a la misma conclusión", "Complementariedad: el estudio de caso explica cómo y por qué se adopta la herramienta; los experimentos miden cuánto cambia el rendimiento"], "correct": 3, "exp": "Cada método aporta una faceta distinta y complementaria del mismo fenómeno de adopción de IA."}, {"type": "single", "q": "El 'audit trail' (estudios de caso) y el 'replication package' (experimentos) comparten como función:", "options": ["Hacer el estudio auditable y reproducible por terceros, aunque su contenido difiere según el tipo de datos", "Ambos se publican exclusivamente en Zenodo, sin excepción", "Ninguno de los dos documentos tiene relación con la validez del estudio", "Son el mismo documento con nombre distinto según el método"], "correct": 0, "exp": "Comparten el propósito de transparencia auditable, con contenido distinto según la naturaleza de los datos."}, {"type": "single", "q": "Un estudiante concluye: 'mi estudio de caso mostró que el equipo A mejoró su velocidad tras adoptar Scrum; esto prueba que Scrum mejora la velocidad de cualquier equipo'. El error que comete se denomina, según la unidad de estudios de caso:", "options": ["Ningún error; es la forma correcta de generalizar", "Error de member checking", "Sobregeneralización (overgeneralization)", "Error de instrumentación"], "correct": 2, "exp": "Extender un hallazgo de caso único a una población general, sin justificación, es sobregeneralización."}, {"type": "single", "q": "Las 5 fases de Runeson & Höst (2009) y los 5 componentes de Wohlin et al. (2012) comparten, como estructura general, la secuencia:", "options": ["Diseño/planificación → preparación/definición → ejecución/recolección → análisis → reporte", "No comparten ninguna estructura; son marcos completamente independientes", "Ambos exigen exactamente el mismo número mínimo de sujetos", "Ambos prohíben el uso de software estadístico como JASP o R"], "correct": 0, "exp": "Ambos marcos siguen la misma progresión general, aunque con nombres propios de cada método."}, {"type": "single", "q": "El caso Ericsson (2022) sobre asignación automática de bugs muestra que:", "options": ["Basta con que una tecnología sea técnicamente precisa para que los equipos la adopten sin resistencia", "La precisión técnica no bastó; factores organizacionales y de confianza fueron determinantes", "La adopción tecnológica no puede estudiarse mediante estudio de caso", "Los ingenieros aceptan automáticamente cualquier sugerencia de un modelo de IA"], "correct": 1, "exp": "El caso Ericsson muestra que factores organizacionales, no solo la precisión técnica, determinaron la adopción."}, {"type": "single", "q": "Lo que determina la elección del método de investigación en IS, según el principio repetido en ambas unidades, es:", "options": ["El número de publicaciones previas sobre el tema en Scopus", "El presupuesto disponible para el proyecto de investigación", "La naturaleza de la pregunta de investigación", "La preferencia personal o la facilidad de ejecución del investigador"], "correct": 2, "exp": "Ambas unidades convergen en que la naturaleza de la pregunta determina el método, no la conveniencia."}, {"type": "single", "q": "Un investigador estudia primero, con un estudio de caso exploratorio en 3 empresas ecuatorianas, la adopción de IA generativa; luego diseña un experimento para probar una hipótesis surgida de ese estudio. Esta secuencia ilustra:", "options": ["Que ambos métodos deben ejecutarse simultáneamente, sin ningún orden", "Un error metodológico grave: nunca deben combinarse ambos métodos sobre el mismo fenómeno", "El uso complementario y secuencial de métodos: exploración cualitativa que genera hipótesis, luego prueba experimental", "Que el estudio de caso reemplaza por completo al experimento una vez ejecutado"], "correct": 2, "exp": "Es un patrón secuencial coherente: exploración cualitativa que genera hipótesis, luego prueba experimental."}, {"type": "single", "q": "El member checking (estudios de caso) y compartir el replication package con revisores (experimentos) tienen en común que:", "options": ["Ambos ceden el control interpretativo final a terceros", "Ambos son mecanismos de censura externa obligatoria antes de publicar", "Ninguno de los dos mecanismos existe realmente en la práctica IS", "En ambos, el investigador retiene la autonomía analítica; solo se valida hechos o se permite verificar el análisis"], "correct": 3, "exp": "Ambos buscan transparencia y verificabilidad, sin ceder el juicio interpretativo final del investigador."}, {"type": "single", "q": "El checklist de Rico (2024) para estudios de caso y los errores de reporte experimental coinciden en señalar como falla crítica:", "options": ["La necesidad de un consentimiento informado firmado digitalmente", "El uso obligatorio de un software estadístico específico como JASP", "No discutir/reportar las amenazas a la validez con su mitigación correspondiente", "El cálculo exacto del tamaño de muestra necesario (n)"], "correct": 2, "exp": "Ambas listas identifican la ausencia de discusión de amenazas a la validez (con mitigación) como falla crítica compartida."}, {"type": "single", "q": "La posición que se desprende de comparar estudio de caso y experimento a lo largo de la unidad es que ambos métodos son:", "options": ["El experimento ha reemplazado por completo al estudio de caso en la investigación IS moderna", "Complementarios: cada uno responde mejor a un tipo distinto de pregunta de investigación", "Mutuamente excluyentes: un investigador debe elegir uno y descartar el otro para siempre", "El estudio de caso ha reemplazado por completo al experimento en la investigación IS moderna"], "correct": 1, "exp": "Ambos métodos son complementarios, cada uno respondiendo mejor a un tipo distinto de pregunta."}, {"type": "single", "q": "Kitchenham et al. (2009) enfocan su crítica principalmente en:", "options": ["La generalización estadística de los estudios de caso", "La reproducibilidad de los experimentos IS publicados", "El uso de entrevistas semiestructuradas en estudios cualitativos", "El cálculo del tamaño del efecto en estudios de caso"], "correct": 1, "exp": "Kitchenham et al. (2009) se enfocan en la reproducibilidad de experimentos IS, no en generalización de estudios de caso."}, {"type": "single", "q": "Un revisor rechaza un estudio de caso por 'no describir el contexto con suficiente detalle' y rechaza un experimento por 'omitir el tamaño del efecto'. El principio metodológico transversal que ilustran ambos rechazos es:", "options": ["Que la transparencia metodológica es un requisito común a cualquier método empírico en IS", "Que solo los estudios financiados por universidades extranjeras cumplen estos requisitos", "Que ambos métodos son inherentemente débiles y deberían evitarse", "Que el contexto de la empresa y el tamaño del efecto son términos intercambiables"], "correct": 0, "exp": "Ambos rechazos apuntan al mismo principio: dar al lector lo necesario para evaluar validez y aplicabilidad."}, {"type": "single", "q": "Comparando el 61% de artículos que omiten el tamaño del efecto (Kampenes et al., 2007) con el patrón de 'validez mencionada solo en el abstract' (Rico, 2024):", "options": ["Kampenes et al. no reportan ningún porcentaje", "Ambos estudios se refieren exclusivamente a estudios de caso", "Kampenes et al. reportan una cifra exacta para experimentos; Rico (2024) describe un patrón cualitativo en estudios de caso, sin cifra exacta", "Ambos porcentajes son exactamente el mismo (61%)"], "correct": 2, "exp": "El 61% es una cifra específica de Kampenes et al.; el hallazgo de Rico se presenta como patrón cualitativo, no numérico."}, {"type": "single", "q": "Si un estudiante debe elegir entre estudio de caso y experimento para investigar 'uso de IA en el desarrollo de software en Ecuador', la pregunta que debería hacerse primero es si su interés busca:", "options": ["Entender un proceso/contexto complejo en profundidad, o medir el efecto causal de una variable manipulable", "El método más fácil de explicar en una defensa oral", "El método con más publicaciones citables en Scopus sobre el tema", "Un método que requiera menos tiempo de análisis estadístico"], "correct": 0, "exp": "La pregunta rectora es si se busca profundidad contextual o causalidad controlada, no facilidad o citabilidad."}, {"type": "single", "q": "Los experimentos IS con sujetos humanos (Erdogmus et al., Peng et al.), respecto a la ética de investigación:", "options": ["No se menciona la ética en la unidad de experimentos", "Requieren igualmente consentimiento informado, bajo los mismos principios éticos que en estudios de caso", "Solo requieren ética si el diseño es between-subject", "Están exentos de consideraciones éticas por usar métricas automáticas"], "correct": 1, "exp": "Los experimentos con sujetos humanos están sujetos a los mismos principios éticos (voluntariedad, beneficencia, transparencia)."}, {"type": "single", "q": "¿Cuál de las siguientes combinaciones 'pregunta de investigación → método correcto' es INCORRECTA?", "options": ["'¿El uso de checklist reduce defectos vs. revisión libre, bajo condiciones controladas?' → Experimento o cuasi-experimento", "'¿Qué factores explican por qué un equipo abandonó Scrum tras 6 meses?' → Estudio de caso explicativo", "'¿Cómo evolucionó la arquitectura de microservicios en una fintech durante 2 años?' → Estudio de caso longitudinal", "'¿Cuántas empresas ecuatorianas están certificadas ISO 25010?' → Estudio de caso explicativo"], "correct": 3, "exp": "Contar cuántas empresas cumplen un criterio es pregunta de prevalencia (encuesta/MSR), no de estudio de caso explicativo."}, {"type": "single", "q": "El contexto se trata de forma distinta en cada método porque:", "options": ["El contexto solo importa en experimentos de simulación", "El contexto se ignora por completo en ambos métodos", "En ambos métodos el contexto se trata exactamente igual, como parte inseparable del fenómeno", "En el estudio de caso el contexto es parte del fenómeno; en el experimento se busca controlarlo o aislarlo para maximizar la validez interna"], "correct": 3, "exp": "Es el trade-off explícito: control (experimento) → validez interna; contexto inseparable (estudio de caso) → validez externa."}, {"type": "single", "q": "La diferencia epistemológica más precisa entre estudio de caso y experimento, según la unidad completa, es que:", "options": ["El estudio de caso es 'ciencia blanda' sin rigor; el experimento es 'ciencia dura' con rigor real", "El experimento siempre precede al estudio de caso en cualquier programa de investigación", "Ambos son formas rigurosas de conocimiento empírico que responden preguntas distintas, cada uno con su propio marco de validez", "Solo uno de los dos métodos es aceptado en publicaciones científicas de primer nivel en IS"], "correct": 2, "exp": "Ambos son formas rigurosas de conocimiento, cada una con su marco de validez propio, sin jerarquía entre ellos."}, {"type": "single", "q": "Que un proyecto de estudio de caso otorgue 40% del puntaje a 'rigor metodológico' y un proyecto de experimento otorgue 40% a 'reporte estadístico completo' revela que ambos currículos priorizan:", "options": ["El componente que garantiza que el estudio pueda evaluarse, defenderse y replicarse por terceros", "Es una coincidencia sin ningún significado metodológico", "Que la nota final depende exclusivamente de la ortografía del reporte", "Que ambos proyectos son en realidad el mismo tipo de trabajo"], "correct": 0, "exp": "Ambos currículos priorizan el rigor metodológico/documental como componente de mayor peso relativo."}, {"type": "single", "q": "El pre-registro del diseño antes de recolectar datos, presente en ambas unidades, tiene como propósito común:", "options": ["Sustituir la necesidad de un comité de ética", "Reducir el tiempo total de la investigación", "Aumentar automáticamente el tamaño de la muestra", "Prevenir el ajuste del diseño o la hipótesis después de conocer los resultados"], "correct": 3, "exp": "El pre-registro previene HARKing/ajustes post-hoc en ambos métodos, no reduce tiempo ni sustituye ética."}, {"type": "single", "q": "Al elegir entre reportar un hallazgo como estudio de caso o como experimento, el criterio que prevalece sobre cualquier otro es:", "options": ["El método que se publica más rápido en revistas indexadas", "El método con el que el investigador tiene más experiencia personal", "Si la pregunta busca causalidad controlada o comprensión contextual profunda", "El método que exige menos participantes"], "correct": 2, "exp": "El criterio rector, repetido en toda la unidad, es la naturaleza de la pregunta: causalidad controlada vs. comprensión contextual."}]}], "total_questions": 270};
</script>
<script>
(function(){
  const app = document.getElementById('app');
  const state = {
    screen: 'menu',
    deckKey: null,
    order: [],
    idx: 0,
    selected: [],
    locked: false,
    score: 0,
    answers: [],
    deckScores: {}
  };

  const GROUP_ORDER = ["Estudios de Caso", "Experimentación", "Examen Real", "Integrador"];

  function deckByKey(key){ return QUIZ_DATA.decks.find(d => d.key === key); }

  function esc(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function render(){
    if(state.screen === 'menu') return renderMenu();
    if(state.screen === 'quiz') return renderQuiz();
    if(state.screen === 'result') return renderResult();
  }

  function renderMenu(){
    let totalQ = QUIZ_DATA.total_questions;
    let html = `
      <div class="masthead">
        <div>
          <div class="eyebrow">ESPE · Software Engineering Research Methods</div>
          <h1>Unidad 3 — Métodos Empíricos en IS</h1>
        </div>
        <div class="tag">${totalQ} preguntas</div>
      </div>
      <div class="subhead">
        <span><b>12</b> bloques</span>
        <span>Estudios de Caso + Experimentación + Examen Real Parcial 3 + Integrador</span>
      </div>
    `;

    GROUP_ORDER.forEach(group => {
      const decks = QUIZ_DATA.decks.filter(d => d.group === group);
      if(!decks.length) return;
      html += `<div class="group-label">${group}</div>`;
      decks.forEach((d, i) => {
        const done = state.deckScores[d.key];
        const special = (group === 'Examen Real' || group === 'Integrador');
        const pct = done ? Math.round(100*done.score/done.total) : null;
        html += `
          <div class="deck-row ${done?'done':''} ${special?'special-row':''}" onclick="QuizApp.startDeck('${d.key}')">
            <div class="num">${String(i+1).padStart(2,'0')}</div>
            <div class="info">
              <h3>${esc(d.title)}</h3>
              <p>${d.questions.length} preguntas${done? ' · completado':''}</p>
            </div>
            ${done ? `<div class="score-pill">${done.score}/${done.total} · ${pct}%</div>` : `<div class="score-pill" style="opacity:.55">Empezar →</div>`}
          </div>
        `;
      });
    });

    html += `<footer class="note">Generado a partir de las 10 presentaciones de la Unidad 3 y de la Prueba Parcial 3 real (reconstruida y verificada contra el contenido de clase).<br>El progreso se guarda solo durante esta sesión del navegador.</footer>`;
    app.innerHTML = html;
  }

  function shuffled(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    return arr;
  }

  function renderQuiz(){
    const deck = deckByKey(state.deckKey);
    const qi = state.order[state.idx];
    const q = deck.questions[qi];
    const isMulti = q.type === 'multi';
    const total = deck.questions.length;

    let optsHtml = '';
    const letters = ['A','B','C','D'];
    q.options.forEach((opt, i) => {
      const isSelected = state.selected.includes(i);
      let cls = isMulti ? 'checkbox' : 'radio';
      if(isSelected) cls += ' selected';
      if(state.locked){
        cls += ' locked';
        const isCorrectOpt = isMulti ? q.correct.includes(i) : q.correct === i;
        if(isCorrectOpt && isSelected) cls += ' correct';
        else if(isCorrectOpt && !isSelected) cls += ' missed';
        else if(!isCorrectOpt && isSelected) cls += ' wrong';
      }
      optsHtml += `
        <li class="opt ${cls}" onclick="QuizApp.toggleOption(${i})">
          <span class="mark">✓</span>
          <span class="letter">${letters[i]})</span>
          <span>${esc(opt)}</span>
        </li>
      `;
    });

    const correctSoFar = state.answers.filter(a=>a.correct).length;

    app.innerHTML = `
      <div class="quiz-topbar">
        <button class="back-link" onclick="QuizApp.toMenu()">← Volver al índice</button>
        <div class="score-live">
          <span>Pregunta <b>${state.idx+1}</b> / ${total}</span>
          <span>Aciertos: <b>${correctSoFar}</b></span>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${(state.idx/total)*100}%"></div></div>
      <div class="card">
        <div class="q-meta">
          <span>${esc(deck.title)}</span>
          ${isMulti ? '<span class="badge-multi">Selecciona todas las que apliquen</span>' : ''}
        </div>
        <p class="q-text">${esc(q.q)}</p>
        <ul class="options">${optsHtml}</ul>
        <div class="explain ${state.locked?'show':''}"><b>Por qué</b>${state.locked ? esc(q.exp) : ''}</div>
        <div class="actions">
          <span class="hint">${state.locked ? '' : (isMulti ? 'Marca una o más opciones' : 'Elige una opción')}</span>
          ${state.locked
            ? `<button class="btn btn-primary" onclick="QuizApp.next()">${state.idx+1 < total ? 'Siguiente →' : 'Ver resultados →'}</button>`
            : `<button class="btn btn-primary" id="verifyBtn" onclick="QuizApp.verify()" ${state.selected.length===0?'disabled':''}>Verificar</button>`
          }
        </div>
      </div>
    `;
  }

  function renderResult(){
    const deck = deckByKey(state.deckKey);
    const total = deck.questions.length;
    const score = state.answers.filter(a=>a.correct).length;
    const pct = Math.round(100*score/total);
    let verdictClass = 'low', verdictText = 'A reforzar';
    if(pct >= 85){verdictClass='great'; verdictText='Excelente';}
    else if(pct >= 60){verdictClass='ok'; verdictText='Bien encaminado';}

    let reviewHtml = '';
    state.answers.forEach((a, i) => {
      const q = deck.questions[state.order[i]];
      if(!a.correct){
        const letters = ['A','B','C','D'];
        const correctTxt = q.type === 'multi'
          ? q.correct.map(c=>letters[c]).join(', ')
          : letters[q.correct];
        reviewHtml += `
          <div class="review-item wrong">
            <div class="rq">${i+1}. ${esc(q.q)}</div>
            <div class="ra">Respuesta correcta: ${correctTxt}) — ${esc(q.exp)}</div>
          </div>
        `;
      }
    });

    app.innerHTML = `
      <div class="quiz-topbar">
        <button class="back-link" onclick="QuizApp.toMenu()">← Volver al índice</button>
      </div>
      <div class="result-card">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <div class="big">${score} / ${total}</div>
        <p style="font-family:var(--mono); color:var(--ink-soft); font-size:.85rem;">${pct}% correcto — ${esc(deck.title)}</p>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="QuizApp.startDeck('${state.deckKey}')">Repetir este bloque</button>
          <button class="btn btn-ghost" onclick="QuizApp.toMenu()">Volver al índice</button>
        </div>
        ${reviewHtml ? `<div class="review-list"><div class="group-label" style="margin-top:0">Preguntas para repasar (${state.answers.filter(a=>!a.correct).length})</div>${reviewHtml}</div>` : ''}
      </div>
    `;
  }

  window.QuizApp = {
    startDeck(key){
      const deck = deckByKey(key);
      state.deckKey = key;
      state.order = shuffled(deck.questions.length);
      state.idx = 0;
      state.selected = [];
      state.locked = false;
      state.answers = [];
      state.screen = 'quiz';
      render();
    },
    toggleOption(i){
      if(state.locked) return;
      const deck = deckByKey(state.deckKey);
      const q = deck.questions[state.order[state.idx]];
      if(q.type === 'multi'){
        const pos = state.selected.indexOf(i);
        if(pos === -1) state.selected.push(i); else state.selected.splice(pos,1);
      } else {
        state.selected = [i];
      }
      render();
    },
    verify(){
      if(state.selected.length === 0) return;
      const deck = deckByKey(state.deckKey);
      const q = deck.questions[state.order[state.idx]];
      let correct;
      if(q.type === 'multi'){
        const sel = [...state.selected].sort().join(',');
        const cor = [...q.correct].sort().join(',');
        correct = sel === cor;
      } else {
        correct = state.selected[0] === q.correct;
      }
      state.locked = true;
      state.answers.push({correct});
      render();
    },
    next(){
      const deck = deckByKey(state.deckKey);
      if(state.idx + 1 < deck.questions.length){
        state.idx += 1;
        state.selected = [];
        state.locked = false;
        render();
      } else {
        state.deckScores[state.deckKey] = {
          score: state.answers.filter(a=>a.correct).length,
          total: deck.questions.length
        };
        state.screen = 'result';
        render();
      }
    },
    toMenu(){
      state.screen = 'menu';
      render();
    }
  };

  render();
})();
</script>
</body>
</html>
