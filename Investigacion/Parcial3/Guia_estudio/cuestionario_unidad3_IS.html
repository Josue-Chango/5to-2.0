<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario · Unidad 3: Métodos Empíricos en IS</title>
<style>
  :root{
    --paper:#F6F3EC;
    --paper-card:#FCFAF5;
    --ink:#1E2A38;
    --ink-soft:#5B6672;
    --rule:#D8D1BF;
    --rule-strong:#B9AF97;
    --red:#A73B34;
    --red-soft:#F1DEDB;
    --green:#3C6E52;
    --green-soft:#DCEADF;
    --gold:#9C7A2E;
    --gold-soft:#F1E6C8;
    --navy:#233854;
    --navy-soft:#DEE5EE;
    --serif: "Source Serif 4", "Iowan Old Style", "Georgia", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 2.1em;
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:900px;margin:0 auto;padding:2.5rem 1.25rem 5rem;}

  /* ---------- Header ---------- */
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:3px solid var(--ink);
    padding-bottom:.9rem; margin-bottom:.3rem;
    flex-wrap:wrap; gap:.5rem;
  }
  .masthead .eyebrow{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--red); font-weight:600;
  }
  .masthead h1{
    font-family:var(--serif); font-weight:600; font-size:1.9rem;
    margin:.15rem 0 0; letter-spacing:-.01em;
  }
  .masthead .tag{
    font-family:var(--mono); font-size:.75rem; color:var(--ink-soft);
    border:1px solid var(--rule-strong); border-radius:3px;
    padding:.25rem .55rem; white-space:nowrap; background:var(--paper-card);
  }
  .subhead{
    font-family:var(--mono); font-size:.78rem; color:var(--ink-soft);
    margin:.6rem 0 2.2rem; display:flex; gap:1.3rem; flex-wrap:wrap;
  }
  .subhead b{color:var(--ink); font-weight:600;}

  /* ---------- Menu (deck list) ---------- */
  .group-label{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--navy); font-weight:700;
    margin:2rem 0 .7rem; display:flex; align-items:center; gap:.6rem;
  }
  .group-label::after{content:""; flex:1; height:1px; background:var(--rule-strong);}
  .group-label:first-of-type{margin-top:0;}

  .deck-row{
    display:flex; align-items:center; gap:1rem;
    background:var(--paper-card);
    border:1px solid var(--rule-strong);
    border-left:4px solid var(--navy);
    border-radius:4px;
    padding:.95rem 1.1rem;
    margin-bottom:.6rem;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .deck-row:hover{
    transform:translateX(3px);
    box-shadow:2px 3px 0 var(--rule-strong);
  }
  .deck-row.done{border-left-color:var(--green);}
  .deck-row .num{
    font-family:var(--mono); font-weight:700; font-size:.95rem;
    color:var(--navy); width:2.4rem; flex-shrink:0;
  }
  .deck-row.done .num{color:var(--green);}
  .deck-row .info{flex:1; min-width:0;}
  .deck-row .info h3{
    font-family:var(--serif); font-size:1.08rem; font-weight:600;
    margin:0 0 .15rem; color:var(--ink);
  }
  .deck-row .info p{
    margin:0; font-size:.8rem; color:var(--ink-soft); font-family:var(--mono);
  }
  .deck-row .score-pill{
    font-family:var(--mono); font-size:.78rem; font-weight:700;
    padding:.3rem .6rem; border-radius:3px; white-space:nowrap;
    background:var(--gold-soft); color:var(--gold); flex-shrink:0;
  }
  .deck-row.done .score-pill{background:var(--green-soft); color:var(--green);}

  .special-row{border-left-color:var(--red);}
  .special-row .num{color:var(--red);}

  /* ---------- Quiz screen ---------- */
  .quiz-topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:1.1rem; gap:1rem; flex-wrap:wrap;
  }
  .back-link{
    font-family:var(--mono); font-size:.78rem; color:var(--navy);
    text-decoration:none; cursor:pointer; border:none; background:none;
    padding:0; display:flex; align-items:center; gap:.3rem;
  }
  .back-link:hover{text-decoration:underline;}
  .score-live{
    font-family:var(--mono); font-size:.82rem; color:var(--ink-soft);
    display:flex; gap:1rem;
  }
  .score-live b{color:var(--ink);}

  .progress-track{
    height:6px; background:var(--rule); border-radius:3px; overflow:hidden;
    margin-bottom:1.6rem;
  }
  .progress-fill{
    height:100%; background:var(--navy); transition:width .25s ease;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--rule-strong);
    border-radius:6px;
    padding:1.9rem 1.9rem 1.6rem;
    position:relative;
    box-shadow:0 1px 0 var(--rule-strong);
  }
  .card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--red); border-radius:6px 0 0 6px;
  }
  .q-meta{
    font-family:var(--mono); font-size:.72rem; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:.6rem;
    display:flex; gap:.7rem; align-items:center;
  }
  .q-meta .badge-multi{
    background:var(--gold-soft); color:var(--gold); border-radius:3px;
    padding:.12rem .45rem; font-weight:700;
  }
  .q-text{
    font-family:var(--serif); font-size:1.18rem; line-height:1.5;
    margin:0 0 1.3rem; color:var(--ink);
  }
  .options{list-style:none; margin:0; padding:0;}
  .opt{
    display:flex; align-items:flex-start; gap:.7rem;
    border:1.5px solid var(--rule-strong);
    border-radius:5px; padding:.75rem .9rem; margin-bottom:.55rem;
    cursor:pointer; font-size:.96rem; line-height:1.45;
    transition:border-color .12s, background .12s;
    background:var(--paper);
  }
  .opt:hover{border-color:var(--navy);}
  .opt .mark{
    flex-shrink:0; width:1.15rem; height:1.15rem; margin-top:.1rem;
    border:1.5px solid var(--ink-soft); display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-family:var(--mono); color:transparent;
  }
  .opt.radio .mark{border-radius:50%;}
  .opt.checkbox .mark{border-radius:3px;}
  .opt.selected .mark{border-color:var(--navy); background:var(--navy); color:#fff;}
  .opt.selected{border-color:var(--navy); background:var(--navy-soft);}

  .opt.locked{cursor:default;}
  .opt.locked.correct{border-color:var(--green); background:var(--green-soft);}
  .opt.locked.correct .mark{border-color:var(--green); background:var(--green); color:#fff;}
  .opt.locked.wrong{border-color:var(--red); background:var(--red-soft);}
  .opt.locked.wrong .mark{border-color:var(--red); background:var(--red); color:#fff;}
  .opt.locked.missed{border-color:var(--green); border-style:dashed;}

  .letter{font-family:var(--mono); font-weight:700; color:var(--ink-soft); flex-shrink:0;}

  .actions{display:flex; justify-content:space-between; align-items:center; margin-top:1.4rem; gap:1rem; flex-wrap:wrap;}
  .btn{
    font-family:var(--sans); font-weight:600; font-size:.88rem;
    border:none; border-radius:4px; padding:.68rem 1.3rem; cursor:pointer;
    transition:opacity .12s, transform .12s;
  }
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:not(:disabled):hover{transform:translateY(-1px);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--rule-strong);}
  .hint{font-family:var(--mono); font-size:.75rem; color:var(--ink-soft);}

  .explain{
    margin-top:1.2rem; padding:.9rem 1.05rem;
    background:var(--gold-soft); border-left:3px solid var(--gold);
    border-radius:0 4px 4px 0; font-size:.9rem; line-height:1.5; color:#4a3c17;
    display:none;
  }
  .explain.show{display:block;}
  .explain b{font-family:var(--mono); text-transform:uppercase; font-size:.72rem; letter-spacing:.06em; display:block; margin-bottom:.3rem; color:var(--gold);}

  /* ---------- Results ---------- */
  .result-card{
    background:var(--paper-card); border:1px solid var(--rule-strong);
    border-radius:6px; padding:2.4rem 2rem; text-align:center;
  }
  .result-card .big{
    font-family:var(--serif); font-size:3.4rem; font-weight:700; color:var(--navy);
    margin:.3rem 0;
  }
  .result-card .verdict{
    font-family:var(--mono); font-size:.85rem; letter-spacing:.06em; text-transform:uppercase;
    padding:.3rem .8rem; border-radius:3px; display:inline-block; margin-bottom:.3rem;
  }
  .verdict.great{background:var(--green-soft); color:var(--green);}
  .verdict.ok{background:var(--gold-soft); color:var(--gold);}
  .verdict.low{background:var(--red-soft); color:var(--red);}
  .result-actions{display:flex; gap:.7rem; justify-content:center; margin-top:1.6rem; flex-wrap:wrap;}
  .review-list{text-align:left; margin-top:2rem; border-top:1px solid var(--rule); padding-top:1.2rem;}
  .review-item{font-size:.85rem; padding:.55rem 0; border-bottom:1px dashed var(--rule);}
  .review-item .rq{font-family:var(--serif); color:var(--ink);}
  .review-item .ra{font-family:var(--mono); font-size:.76rem; color:var(--ink-soft); margin-top:.2rem;}
  .review-item.wrong .ra{color:var(--red);}

  footer.note{
    font-family:var(--mono); font-size:.72rem; color:var(--ink-soft);
    text-align:center; margin-top:3rem; line-height:1.6;
  }

  @media (max-width:560px){
    .masthead h1{font-size:1.5rem;}
    .card{padding:1.3rem 1.1rem;}
    .result-card .big{font-size:2.5rem;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const QUIZ_DATA = {"decks": [{"key": "ec13", "title": "Clase 13 · Introducción a Estudios de Caso en IS", "group": "Estudios de Caso", "questions": [{"type": "single", "q": "Según Runeson & Höst (2009), un estudio de caso investiga un fenómeno que es:", "options": ["Proyectado a futuro mediante modelos predictivos", "Simulado bajo condiciones de laboratorio", "Histórico, ya concluido y documentado", "Contemporáneo, dentro de su contexto real"], "correct": 3, "exp": "La definición exige un fenómeno contemporáneo en su contexto real, no histórico, simulado ni proyectivo."}, {"type": "single", "q": "Un caso de uso (use case) de UML y un estudio de caso de investigación se diferencian en que:", "options": ["Ambos son metodologías de investigación empírica completas", "El primero modela requisitos; el segundo es una metodología empírica completa", "El primero se usa en proyectos ágiles; el segundo únicamente en cascada", "El primero requiere protocolo ético; el segundo no lo requiere"], "correct": 1, "exp": "Son conceptos de naturaleza distinta: modelado de requisitos vs. metodología de investigación."}, {"type": "single", "q": "Según Yin (2014), un estudio cuya pregunta es '¿cómo está organizado el proceso DevOps en una empresa mediana?' y busca retratar el fenómeno en detalle, se clasifica como:", "options": ["Descriptivo", "Explicativo", "Exploratorio", "Instrumental"], "correct": 0, "exp": "Retratar el fenómeno en detalle corresponde al tipo descriptivo, no al explicativo (causas) ni al exploratorio (hipótesis nuevas)."}, {"type": "single", "q": "La clasificación en intrínseco, instrumental y colectivo corresponde a:", "options": ["Wohlin et al. (2012), por tipo de diseño", "Runeson & Höst (2009), por fase del proceso", "Stake (1995), por motivación del investigador", "Yin (2014), por propósito del estudio"], "correct": 2, "exp": "Esa taxonomía es de Stake (1995), no de Yin, quien clasifica por propósito (exploratorio/descriptivo/explicativo)."}, {"type": "single", "q": "Un investigador estudia un único proyecto de software y, dentro de él, analiza por separado a cada uno de sus equipos como subunidades de análisis. Este diseño es:", "options": ["Caso múltiple embebido", "Caso único embebido", "Caso múltiple holístico", "Caso único holístico"], "correct": 1, "exp": "\"Caso único\" porque es un solo proyecto; \"embebido\" porque tiene múltiples unidades de análisis dentro de ese caso."}, {"type": "single", "q": "El estudio de Lwakatare et al. (2016) sobre adopción de DevOps, que analiza 5 empresas finlandesas comparadas de forma cruzada, es un ejemplo de:", "options": ["Caso único longitudinal", "Caso múltiple embebido", "Caso múltiple holístico", "Caso único embebido"], "correct": 2, "exp": "Cinco empresas distintas, cada una analizada globalmente y comparadas entre sí, es caso múltiple holístico, no embebido (no hay subunidades dentro de cada empresa)."}, {"type": "single", "q": "Una pregunta de investigación formulada como '¿qué porcentaje de equipos usa TDD?' apunta metodológicamente hacia:", "options": ["Estudio de caso descriptivo", "Estudio de caso exploratorio", "Encuesta", "Estudio de caso explicativo"], "correct": 2, "exp": "Preguntas de \"cuánto/qué porcentaje\" apuntan a encuesta; el estudio de caso responde \"cómo/por qué\", no cuantifica prevalencia."}, {"type": "single", "q": "¿Cuál es el orden correcto de las 5 fases del proceso de Runeson & Höst (2009)?", "options": ["Recolección → Diseño → Preparación → Análisis → Reporte", "Diseño → Recolección → Preparación → Reporte → Análisis", "Diseño → Preparación → Recolección → Análisis → Reporte", "Preparación → Diseño → Recolección → Análisis → Reporte"], "correct": 2, "exp": "El orden estándar es Diseño, Preparación, Recolección, Análisis y Reporte."}, {"type": "single", "q": "Obtener acceso al caso y realizar la preparación ética (consentimiento informado, confidencialidad) corresponde a la fase de:", "options": ["Diseño", "Análisis", "Recolección", "Preparación"], "correct": 3, "exp": "Acceso y ética son actividades de la fase de Preparación, no de Diseño ni de Recolección."}, {"type": "single", "q": "En el proyecto GeneLab de la NASA, la unidad principal de análisis son los experimentos biológicos en microgravedad, y las subunidades son:", "options": ["Cada publicación científica derivada", "Cada astronauta de la Estación Espacial", "Distintos países participantes en el programa", "Múltiples organismos y condiciones experimentales"], "correct": 3, "exp": "GeneLab es un caso único embebido, con múltiples organismos y condiciones experimentales como subunidades."}, {"type": "single", "q": "El proyecto JunoCam de la NASA, con miles de ciudadanos como unidades de análisis, se clasifica como un caso:", "options": ["Múltiple", "Instrumental sin interés en el caso mismo", "Único embebido", "Longitudinal exclusivamente"], "correct": 0, "exp": "JunoCam se describe como caso múltiple, con miles de unidades de análisis y replicación distribuida."}, {"type": "single", "q": "El seguimiento del Hurricane Ida antes, durante y después del evento, con múltiples fuentes a lo largo del tiempo, ilustra un diseño de estudio de caso:", "options": ["Instrumental", "Longitudinal", "Transversal", "Retrospectivo puro"], "correct": 1, "exp": "El seguimiento temporal con múltiples fuentes corresponde a un diseño longitudinal, no a una medición puntual (transversal)."}, {"type": "single", "q": "Entre las fallas críticas de estudios de caso IS identificadas por Rico (2024), se incluye:", "options": ["Incluir demasiadas fuentes de evidencia", "Reportar el tamaño del efecto con excesivo detalle", "Uso de entrevistas semiestructuradas en lugar de estructuradas", "No discutir la generalización de los resultados"], "correct": 3, "exp": "No discutir la generalización es una de las 4 fallas de Rico (2024); el tipo de entrevista no es una de ellas."}, {"type": "single", "q": "Cuando un estudio de caso no discute la generalización de sus resultados, la consecuencia directa es:", "options": ["Reclasificación automática del estudio como encuesta", "Imposibilidad de calcular el tamaño del efecto", "Overgeneralization: conclusiones inválidas al asumirse aplicables universalmente", "Pérdida automática de validez de constructo"], "correct": 2, "exp": "La consecuencia directa señalada es la sobregeneralización de conclusiones, no un problema de validez de constructo."}, {"type": "single", "q": "Un buen estudio de caso, según el criterio de cierre de Rico (2024), permite al lector:", "options": ["Calcular el tamaño del efecto sin necesidad de leer el método", "Entender el caso tan bien como el investigador y juzgar su transferibilidad", "Replicar estadísticamente el hallazgo con una muestra mayor", "Aplicar automáticamente los hallazgos a cualquier organización"], "correct": 1, "exp": "El criterio es comprensión equivalente + juicio de transferibilidad, no generalización estadística ni aplicación automática."}, {"type": "single", "q": "Respecto a la relación entre contexto y datos en un estudio de caso:", "options": ["El contexto es ruido que debe filtrarse antes del análisis", "El contexto solo importa en estudios de caso instrumentales", "El contexto se reemplaza por variables de control como en un experimento", "El contexto es parte de los datos, no algo que deba eliminarse"], "correct": 3, "exp": "El principio central del estudio de caso es que el contexto es dato, no ruido a eliminar."}, {"type": "single", "q": "Las preguntas de investigación de un estudio de caso deben formularse comenzando con:", "options": ["\"¿Cómo...?\" o \"¿Por qué...?\"", "\"¿Existe diferencia...?\"", "\"¿Cuánto...?\" o \"¿Qué porcentaje...?\"", "Pueden formularse como afirmaciones, no como preguntas"], "correct": 0, "exp": "El enfoque de estudio de caso exige preguntas de proceso o causalidad contextual: \"cómo\" o \"por qué\"."}, {"type": "single", "q": "Yin (2014) clasifica los estudios de caso por su propósito en exploratorio, descriptivo y explicativo. Stake (1995), en cambio, clasifica por:", "options": ["La motivación o interés del investigador en el caso", "El número de casos incluidos en el estudio", "El nivel de control experimental aplicado", "El tipo de fuentes de evidencia utilizadas"], "correct": 0, "exp": "Stake (1995) clasifica según la motivación del investigador (intrínseco, instrumental, colectivo), un criterio distinto al de Yin."}, {"type": "single", "q": "Basili & Selby (1986), a diferencia de Runeson & Höst (2009), son una referencia clave de la unidad de:", "options": ["Ética en investigación, por sus principios de consentimiento informado", "Experimentación, por comparar métodos de detección de defectos", "Encuestas, por su metodología de muestreo estadístico", "Estudios de caso, por su trabajo sobre codificación cualitativa"], "correct": 1, "exp": "Basili & Selby (1986) pertenecen a la unidad de Experimentación (comparación de métodos de detección de defectos), no a Estudios de Caso."}, {"type": "single", "q": "Un caso único se diferencia de un caso múltiple principalmente en que:", "options": ["El caso único analiza un solo caso; el múltiple compara dos o más casos entre sí", "El caso único es exclusivamente cuantitativo; el múltiple exclusivamente cualitativo", "El caso único requiere aleatorización; el múltiple no la requiere", "El caso único siempre tiene subunidades embebidas; el múltiple nunca las tiene"], "correct": 0, "exp": "La diferencia central es el número de casos analizados (uno vs. varios comparados entre sí), no la presencia de subunidades ni el tipo de datos."}]}, {"key": "ec14", "title": "Clase 14 · Diseño y Planificación del Estudio de Caso en IS", "group": "Estudios de Caso", "questions": [{"type": "single", "q": "Según Yin (2014, p. 27), el diseño de la investigación es:", "options": ["La lista de empresas candidatas para el estudio", "Un trámite administrativo previo a la aprobación ética", "La lógica que conecta los datos por recolectar con las preguntas iniciales", "El conjunto de instrumentos estadísticos del análisis"], "correct": 2, "exp": "Es la definición de Yin (2014): el diseño conecta datos, conclusiones y preguntas iniciales."}, {"type": "single", "q": "De los 5 componentes del diseño de Yin (2014), el que responde a \"¿cómo sé si mis hallazgos son válidos?\" es:", "options": ["Proposiciones", "Unidad de análisis", "Lógica de vinculación", "Criterios de interpretación"], "correct": 3, "exp": "El componente Criterios de interpretación responde específicamente esa pregunta."}, {"type": "single", "q": "¿Cuál es la diferencia central entre una proposición de estudio de caso y una hipótesis estadística (H0/H1)?", "options": ["La proposición orienta qué observar; la hipótesis se prueba estadísticamente con un test formal", "La hipótesis solo se usa en exploratorios; la proposición en explicativos", "No hay diferencia real; son términos intercambiables", "La proposición requiere cálculo previo de potencia estadística"], "correct": 0, "exp": "La proposición orienta la observación cualitativa; la hipótesis estadística se prueba formalmente."}, {"type": "single", "q": "Un estudio de caso descriptivo o explicativo, respecto a las proposiciones:", "options": ["Debe tener al menos una proposición", "Debe tener exactamente tres proposiciones", "Nunca las necesita; solo los exploratorios las requieren", "Puede sustituirlas por una hipótesis estadística formal"], "correct": 0, "exp": "Descriptivo/explicativo requiere al menos una proposición; solo el exploratorio puede prescindir de ella."}, {"type": "single", "q": "\"Elegí esta empresa porque el gerente me dio acceso\" es un ejemplo de:", "options": ["Justificación metodológica válida por muestreo intencional", "Una proposición basada en la práctica profesional", "Justificación insuficiente; falta un criterio de relevancia documentado", "El criterio estándar de Yin (2014) para seleccionar un caso"], "correct": 2, "exp": "El acceso por sí solo no es justificación metodológica suficiente; se requiere un criterio de relevancia."}, {"type": "single", "q": "Lwakatare et al. (2016) seleccionaron 5 empresas finlandesas de tamaños distintos con el fin de obtener:", "options": ["Variación intencional en el contexto", "Representatividad estadística de la población de empresas", "Una muestra aleatoria estratificada por tamaño", "El mínimo de casos exigido por convención académica"], "correct": 0, "exp": "El objetivo fue variación intencional en el contexto, no representatividad estadística poblacional."}, {"type": "single", "q": "El protocolo de un estudio de caso, según Runeson & Höst (2009), se elabora:", "options": ["Únicamente si el estudio involucra más de un caso", "Antes de entrar al campo, en la fase de planificación", "Solo cuando lo exige el comité de ética", "Después de recolectar los datos, como resumen del trabajo de campo"], "correct": 1, "exp": "El protocolo se elabora antes de la recolección de datos, en la fase de planificación."}, {"type": "single", "q": "¿Cuál de los siguientes elementos SÍ forma parte de las 7 secciones del protocolo de un estudio de caso?", "options": ["Diseño factorial de los tratamientos", "Nivel de significancia (α)", "Cálculo de potencia estadística (β = 0.80)", "Fuentes de evidencia planificadas"], "correct": 3, "exp": "Fuentes de evidencia planificadas es una sección real del protocolo; las otras tres pertenecen al diseño experimental, no al del estudio de caso."}, {"type": "single", "q": "¿Qué diferencia hay entre la carta de autorización y el consentimiento informado?", "options": ["El consentimiento lo firma la organización; la carta cada participante", "Ambos son innecesarios si existe un acuerdo de confidencialidad", "La carta la firma la organización; el consentimiento lo firma cada participante", "Son el mismo documento con distinto nombre según el país"], "correct": 2, "exp": "La carta de autorización es institucional; el consentimiento informado es individual y voluntario."}, {"type": "single", "q": "Entre los principios éticos de Runeson et al. (2012), ¿cuál de los siguientes NO aparece?", "options": ["Voluntariedad", "Transparencia", "Reproducibilidad estadística", "Beneficencia"], "correct": 2, "exp": "Los 4 principios son voluntariedad, beneficencia, transparencia y reversibilidad; la reproducibilidad estadística no corresponde a estudios de caso."}, {"type": "single", "q": "El riesgo real de omitir los pasos de acceso y preparación ética es:", "options": ["Perder el acceso al caso a mitad del estudio o invalidar los datos éticamente", "La reclasificación automática del estudio como encuesta", "Ninguno; la ética es independiente del rigor metodológico", "Una sanción administrativa que no afecta la calidad científica"], "correct": 0, "exp": "Omitir estos pasos compromete directamente la viabilidad y validez ética del estudio."}, {"type": "single", "q": "El OSDMP (Open Science and Data Management Plan) de la NASA es el equivalente directo de:", "options": ["El informe final del estudio de caso", "El consentimiento informado de cada participante", "La cadena de evidencia (audit trail)", "El protocolo de un estudio de caso IS"], "correct": 3, "exp": "El OSDMP es el equivalente NASA al protocolo del estudio de caso, elaborado antes de recolectar datos."}, {"type": "single", "q": "El pre-registro público del diseño de un estudio, antes de recolectar datos, previene específicamente:", "options": ["La contaminación entre grupos", "El HARKing (formular hipótesis después de ver los resultados)", "El efecto Hawthorne", "El error tipo II"], "correct": 1, "exp": "El pre-registro previene el HARKing, no el efecto Hawthorne ni el error tipo II (propios de experimentos)."}, {"type": "single", "q": "La estrategia \"análisis rival de explicaciones alternativas y lógica de vinculación explícita\" corresponde, en la tabla de validez de Yin (2014), a:", "options": ["Validez externa", "Validez interna", "Validez de constructo", "Confiabilidad"], "correct": 1, "exp": "Esa estrategia corresponde a validez interna (\"¿mis explicaciones son correctas?\")."}, {"type": "single", "q": "¿Qué diferencia hay entre validez de constructo y confiabilidad en un estudio de caso?", "options": ["Constructo se mide con el valor p", "Son la misma amenaza con dos nombres distintos", "Constructo pregunta '¿mido lo que digo que mido?'; confiabilidad pregunta '¿otro investigador llegaría al mismo lugar?'", "Confiabilidad solo aplica a casos múltiples"], "correct": 2, "exp": "Son amenazas distintas, con preguntas y estrategias de mitigación propias cada una."}, {"type": "single", "q": "El error más común respecto a la validez en papers de estudios de caso IS es:", "options": ["Discutir la validez con exceso de detalle", "No mencionar la validez en ningún lugar del paper", "Confundir validez interna con externa desde la introducción", "Mencionar 'validez' en el abstract pero no discutirla en el cuerpo del texto"], "correct": 3, "exp": "El patrón más común identificado es mencionar la validez superficialmente en el abstract sin desarrollarla en el cuerpo del paper."}, {"type": "single", "q": "Las categorías de criterio de Yin (2014) para justificar la selección de la unidad de análisis son:", "options": ["Aleatorio, sistemático, estratificado, por conglomerados", "Típico, extremo, crítico, revelador", "Cuantitativo, cualitativo, mixto, longitudinal", "Interno, externo, de constructo, de confiabilidad"], "correct": 1, "exp": "Esas cuatro categorías (típico/extremo/crítico/revelador) son el criterio de Yin para justificar el caso."}, {"type": "single", "q": "El muestreo intencional en estudios de caso se basa principalmente en:", "options": ["La disponibilidad de financiamiento externo", "La relevancia del caso para responder la pregunta de investigación", "La representatividad estadística respecto a la población", "Un tamaño mínimo de 30 casos por convención académica"], "correct": 1, "exp": "El estudio de caso no muestrea estadísticamente; selecciona según relevancia, no representatividad poblacional."}, {"type": "single", "q": "Respecto a los 5 componentes del diseño de Yin (2014), los que se omiten con mayor frecuencia en estudios de caso publicados son:", "options": ["Proposiciones, unidad de análisis, lógica de vinculación y criterios de interpretación", "Ninguno; todos se reportan con igual frecuencia", "Únicamente las preguntas de investigación", "Únicamente la unidad de análisis"], "correct": 0, "exp": "Los componentes 2 al 5 (no solo uno) son los más frecuentemente omitidos en la literatura."}, {"type": "single", "q": "Un diseño sin proposiciones definidas, en un estudio de caso explicativo, tiende a convertirse en:", "options": ["Un análisis puramente estadístico", "Una encuesta de opinión", "Un experimento cuasi-controlado", "Descripción sin explicación"], "correct": 3, "exp": "Sin proposiciones que orienten la interpretación, un estudio explicativo se degrada a mera descripción, sin explicar el porqué."}]}, {"key": "ec15", "title": "Clase 15 · Recolección de Datos en Estudios de Caso IS", "group": "Estudios de Caso", "questions": [{"type": "single", "q": "Según Yin (2014, p. 119), la fortaleza distintiva de los estudios de caso es:", "options": ["La ausencia total de subjetividad en los datos", "El control estadístico de variables de confusión", "El uso exclusivo de entrevistas estructuradas", "La posibilidad de usar múltiples fuentes de evidencia"], "correct": 3, "exp": "La fortaleza distintiva es la triangulación de múltiples fuentes de evidencia."}, {"type": "single", "q": "Un estudio de caso sólido, respecto al número de fuentes de evidencia, debe combinar:", "options": ["El mínimo que determine el comité de ética", "Exactamente cuatro fuentes, sin excepción", "Al menos dos, idealmente tres o más para triangular", "Una sola fuente, si es una entrevista en profundidad"], "correct": 2, "exp": "La regla es: nunca una sola fuente, al menos dos, idealmente tres o más."}, {"type": "single", "q": "¿Cuál de las siguientes NO es una de las 4 fuentes de evidencia (Yin, 2014) en estudios de caso?", "options": ["Entrevistas", "Documentos", "Encuestas estadísticas a gran escala", "Observación"], "correct": 2, "exp": "Las 4 fuentes son entrevistas, observación, documentos y artefactos/métricas; la encuesta a gran escala pertenece a otro método."}, {"type": "single", "q": "Los documentos como fuente de evidencia se caracterizan por ser:", "options": ["Objetivos y persistentes, pero pueden ser incompletos o formales", "Útiles únicamente en estudios de caso explicativos", "Siempre completos y libres de cualquier sesgo institucional", "La única fuente que no requiere triangulación"], "correct": 0, "exp": "Los documentos son objetivos y persistentes, pero con la limitación de ser potencialmente incompletos o formales."}, {"type": "single", "q": "Frente a la entrevista estructurada y la no estructurada, la semiestructurada se recomienda porque:", "options": ["No requiere consentimiento informado de los participantes", "Es la única modalidad aceptada en revistas indexadas de IS", "Combina un guión orientador con libertad de explorar", "Su duración máxima es de 15 minutos"], "correct": 2, "exp": "La semiestructurada equilibra profundización (no estructurada) y comparabilidad (estructurada)."}, {"type": "single", "q": "En las entrevistas de un estudio de caso, se recomienda evitar principalmente:", "options": ["Transcribir dentro de las 24 horas", "Usar preguntas de sí/no como preguntas principales", "Grabar con consentimiento explícito", "Limitar la sesión a 60-90 minutos"], "correct": 1, "exp": "Las preguntas de sí/no como principales limitan la profundidad; las otras tres son buenas prácticas."}, {"type": "single", "q": "En una guía de entrevista de 3 bloques, las preguntas principales vinculadas al protocolo de investigación corresponden a:", "options": ["El bloque de consentimiento informado", "El bloque de contexto del participante", "El bloque de cierre", "El bloque central de preguntas principales"], "correct": 3, "exp": "Las preguntas principales, vinculadas al protocolo, ocupan el bloque central de la entrevista."}, {"type": "single", "q": "La observación no participante se usa típicamente para:", "options": ["Reemplazar por completo a las entrevistas", "Investigación-acción o etnografía prolongada", "Reuniones, demos o stand-ups", "Estudios que no requieren ningún consentimiento"], "correct": 2, "exp": "La observación no participante es apropiada para reuniones/demos; la participante para investigación-acción o etnografía."}, {"type": "single", "q": "Los tickets/issues (Jira, GitHub Issues), como tipo de documento, revelan principalmente:", "options": ["El organigrama jerárquico del equipo", "El presupuesto anual del proyecto", "Políticas oficiales de la organización", "Prioridades reales, deuda técnica y conflictos"], "correct": 3, "exp": "Los tickets/issues revelan la práctica real del equipo: prioridades, deuda técnica y conflictos."}, {"type": "single", "q": "Los documentos oficiales de una empresa, respecto a la práctica real del equipo:", "options": ["Pueden diferir de ella, por lo que deben triangularse con observación o entrevistas", "Siempre la reflejan con precisión total", "Nunca deben usarse como fuente de evidencia", "Solo son válidos si tienen menos de un año de antigüedad"], "correct": 0, "exp": "Los documentos oficiales pueden divergir de la práctica real; por eso se exige triangulación con otras fuentes."}, {"type": "single", "q": "¿Qué diferencia hay entre triangulación 'de datos' y triangulación 'metodológica'?", "options": ["La metodológica solo aplica con más de un investigador codificando", "La de datos es exclusiva de estudios explicativos", "Son sinónimos; ambas requieren exactamente dos investigadores", "La de datos combina múltiples fuentes; la metodológica combina métodos cualitativos y cuantitativos"], "correct": 3, "exp": "Son dos tipos distintos: de datos (múltiples fuentes) y metodológica (cualitativo + cuantitativo)."}, {"type": "single", "q": "Según Schlunegger et al. (2024), el enfoque de triangulación más sólido para aumentar la credibilidad de los hallazgos es:", "options": ["La triangulación de investigadores exclusivamente", "No triangular y confiar en una sola fuente bien documentada", "La triangulación metodológica, combinando fuentes cualitativas y cuantitativas", "La triangulación teórica exclusivamente"], "correct": 2, "exp": "El hallazgo de 2024 señala la triangulación metodológica como el enfoque más sólido."}, {"type": "single", "q": "Sobre el número de entrevistas suficientes en un estudio de caso, el criterio real es:", "options": ["La saturación teórica, sin un número fijo predeterminado", "Siempre exactamente 30 entrevistas", "Depende exclusivamente del comité de ética", "Un mínimo legal de 5 entrevistas por país"], "correct": 0, "exp": "No hay número fijo; el criterio real es la saturación teórica de los datos."}, {"type": "single", "q": "Según Glaser & Strauss (1967), la saturación de datos se alcanza cuando:", "options": ["Las nuevas fuentes ya no aportan información que cambie o enriquezca el análisis", "Se obtiene un Cohen's Kappa superior a 0.80", "El investigador decide detener la recolección por falta de tiempo", "Se completan exactamente 10 entrevistas"], "correct": 0, "exp": "La saturación es un criterio cualitativo e informativo, no un conteo fijo ni una métrica estadística."}, {"type": "single", "q": "Cuando el acceso al caso es limitado y no se alcanza saturación teórica plena, se recomienda:", "options": ["Detener el estudio y declararlo no publicable", "Documentar explícitamente cuánto se recolectó y por qué se detuvo", "Sustituir las entrevistas faltantes con datos simulados sin advertirlo", "Extender el estudio indefinidamente hasta lograr saturación completa"], "correct": 1, "exp": "El límite real de acceso debe documentarse de forma transparente, no ocultarse ni forzarse artificialmente."}, {"type": "single", "q": "El 'member checking' consiste en:", "options": ["El proceso de seleccionar a los miembros del equipo investigador", "Devolver los hallazgos preliminares a los participantes para que los validen o complementen", "Un algoritmo automático para verificar datos cuantitativos", "Un proceso de auditoría financiera del proyecto"], "correct": 1, "exp": "Es devolver los hallazgos a los participantes para validación, no un proceso automático ni administrativo."}, {"type": "single", "q": "En el member checking, el investigador conserva la autonomía analítica porque:", "options": ["El participante puede modificar libremente las conclusiones teóricas", "El participante confirma o cuestiona los hechos, no las conclusiones teóricas", "El investigador debe aceptar cualquier corrección que proponga el participante", "El member checking sustituye a la triangulación de fuentes"], "correct": 1, "exp": "El límite ético es que el participante valida hechos, no reescribe la interpretación teórica del investigador."}, {"type": "single", "q": "En el seguimiento de Hurricane Ida, la robustez del hallazgo provino de:", "options": ["Más fuentes diferentes que convergen en el mismo hallazgo", "Reducir el número de fuentes para simplificar el análisis", "Usar exclusivamente fuentes cuantitativas", "Recolectar más datos de la misma fuente satelital"], "correct": 0, "exp": "La robustez del estudio de caso viene de fuentes diferentes que convergen, no de más volumen de una sola fuente."}, {"type": "single", "q": "Una guía de entrevista semiestructurada bien diseñada, con preguntas abiertas vinculadas al protocolo, debe incluir además:", "options": ["Preguntas cerradas de sí/no como respaldo", "Una pregunta de seguimiento por cada pregunta principal, del tipo '¿puedes dar un ejemplo?'", "Un consentimiento verbal, sin necesidad de registro escrito", "Un cálculo previo de potencia estadística"], "correct": 1, "exp": "Cada pregunta principal abierta debe acompañarse de una pregunta de profundización o seguimiento."}, {"type": "single", "q": "La diferencia entre observación participante y no participante radica en que:", "options": ["La participante no requiere ningún consentimiento; la no participante sí", "Ambas son idénticas en su nivel de involucramiento", "La no participante es exclusiva de estudios de caso explicativos", "La participante involucra al investigador en la actividad observada; la no participante lo mantiene como espectador externo"], "correct": 3, "exp": "La diferencia central es el grado de involucramiento del investigador en la actividad observada."}]}, {"key": "ec16", "title": "Clase 16 · Análisis y Reporte de Estudios de Caso IS", "group": "Estudios de Caso", "questions": [{"type": "single", "q": "Según Rico (ICSE 2024), 'la brecha más peligrosa' en estudios de caso IS es:", "options": ["No recolectar suficientes entrevistas", "No usar software especializado como NVivo o Atlas.ti", "Describir lo que se encontró sin explicar cómo se llegó de los datos a esa conclusión", "No incluir tablas comparativas en el reporte"], "correct": 2, "exp": "La brecha es describir hallazgos sin explicar el camino analítico desde los datos hasta la conclusión."}, {"type": "single", "q": "De las estrategias de análisis de Runeson & Höst (2009), la basada en proposiciones se recomienda especialmente para estudios de tipo:", "options": ["Exploratorio", "Instrumental", "Explicativo", "Descriptivo puro"], "correct": 2, "exp": "Al ser más estructurada, se recomienda para estudios explicativos."}, {"type": "single", "q": "El propósito del 'análisis rival' en estudios de caso es:", "options": ["Sustituir la codificación abierta por un algoritmo automático", "Confirmar la proposición inicial descartando datos contradictorios", "Comparar estadísticamente dos grupos de participantes", "Buscar explicaciones alternativas igual de plausibles que la proposición inicial"], "correct": 3, "exp": "El análisis rival fortalece la validez interna buscando explicaciones alternativas, no confirmando sesgadamente."}, {"type": "single", "q": "Según Strauss & Corbin (1990), el orden correcto de la codificación cualitativa es:", "options": ["Selectiva → Axial → Abierta", "Abierta → Selectiva → Axial", "Axial → Abierta → Selectiva", "Abierta → Axial → Selectiva"], "correct": 3, "exp": "El orden es: abierta (etiquetar), axial (agrupar en categorías), selectiva (categoría central)."}, {"type": "single", "q": "Agrupar los códigos 'resistencia del equipo' y 'falta de capacitación' en la categoría 'barreras organizacionales' corresponde a:", "options": ["Codificación axial", "Codificación abierta", "Triangulación teórica", "Codificación selectiva"], "correct": 0, "exp": "Agrupar códigos en categorías con relaciones entre ellas es codificación axial."}, {"type": "single", "q": "Un valor de Cohen's Kappa (κ) de 0.55 entre dos codificadores se clasifica como:", "options": ["Sustancial (0.60 ≤ κ < 0.80)", "Necesita revisión (κ < 0.60)", "No interpretable sin un tercer codificador", "Excelente (κ ≥ 0.80)"], "correct": 1, "exp": "κ = 0.55 cae por debajo de 0.60, por lo que corresponde a 'necesita revisión'."}, {"type": "single", "q": "El rol adecuado de los LLMs en el análisis cualitativo es:", "options": ["Estar prohibido en cualquier fase del análisis cualitativo académico", "Asistir en la codificación inicial, mientras la interpretación sigue siendo del investigador", "Sustituir el cálculo de Cohen's Kappa entre codificadores", "Reemplazar completamente al investigador humano en interpretación y selección de temas"], "correct": 1, "exp": "Los LLMs asisten en codificación inicial; la interpretación y el juicio analítico son responsabilidad humana."}, {"type": "single", "q": "¿Cuál es el orden correcto de las 6 fases del análisis temático de Braun & Clarke (2006)?", "options": ["Familiarización → códigos iniciales → buscar temas → revisar temas → definir/nombrar temas → producir el reporte", "Familiarización → definir temas → códigos iniciales → revisar temas → buscar temas → producir el reporte", "Códigos iniciales → familiarización → definir temas → buscar temas → revisar temas → producir el reporte", "Producir el reporte → familiarización → códigos iniciales → buscar temas → revisar temas → definir temas"], "correct": 0, "exp": "Ese es el orden exacto establecido por Braun & Clarke (2006)."}, {"type": "single", "q": "Cada tema identificado en un análisis temático debe tener como mínimo:", "options": ["10 instancias de evidencia, de la misma fuente", "No existe un mínimo definido", "3 instancias de evidencia, de fuentes diferentes", "1 instancia de evidencia, de cualquier fuente"], "correct": 2, "exp": "El mínimo exigido es 3 instancias de evidencia provenientes de fuentes diferentes."}, {"type": "single", "q": "¿Cuál de los siguientes elementos NO forma parte del audit trail (cadena de evidencia) de un estudio de caso?", "options": ["Base de datos del caso (transcripciones, notas de campo)", "Registro de member checking", "Registro de codificación (quién codificó, cuándo, con qué herramienta)", "El tamaño del efecto (d de Cohen) de un experimento asociado"], "correct": 3, "exp": "El tamaño del efecto es una métrica de reporte experimental, no un elemento del audit trail cualitativo."}, {"type": "single", "q": "El orden correcto de análisis en estudios de caso múltiples es:", "options": ["Analizar primero el cross-case y luego el within-case", "Mezclar los datos de todos los casos desde el inicio para ahorrar tiempo", "Analizar cada caso por separado (within-case) y luego comparar entre casos (cross-case)", "Solo se necesita within-case si el estudio tiene un único caso embebido"], "correct": 2, "exp": "Primero se analiza cada caso individualmente, luego se compara entre casos, no al revés ni mezclado desde el inicio."}, {"type": "single", "q": "¿Qué diferencia hay entre 'replicación literal' y 'replicación teórica' en análisis cross-case?", "options": ["La literal se usa solo en casos únicos", "La literal busca los mismos hallazgos en contextos similares; la teórica busca hallazgos opuestos en contextos predichos como diferentes", "La teórica requiere obligatoriamente análisis estadístico inferencial", "No hay diferencia real; son sinónimos"], "correct": 1, "exp": "Literal: mismos hallazgos en contextos similares. Teórica: hallazgos opuestos en contextos distintos predichos."}, {"type": "single", "q": "El formato narrativo de reporte, comparado con el IMRaD adaptado, requiere:", "options": ["Está reservado exclusivamente para casos múltiples", "Igual rigor metodológico; solo cambia la forma de presentación", "Menos rigor metodológico por ser más informal", "No puede incluir preguntas de investigación explícitas"], "correct": 1, "exp": "El rigor no depende del formato de presentación elegido, solo cambia la forma en que se comunica."}, {"type": "single", "q": "¿Cuál de las siguientes NO es una regla esencial del reporte según Rico (2024)?", "options": ["Describir el contexto con suficiente detalle para juzgar la transferibilidad", "Nombrar explícitamente el tipo de estudio (exploratorio/descriptivo/explicativo)", "Dedicar una sección a las amenazas a la validez y sus mitigaciones", "Reportar el valor p exacto y el tamaño del efecto de cada hallazgo cualitativo"], "correct": 3, "exp": "El valor p y el tamaño del efecto corresponden a experimentos cuantitativos, no a las reglas de reporte cualitativo de Rico (2024)."}, {"type": "single", "q": "El caso JWST CO₂ (NASA) ilustra que un mismo hallazgo científico:", "options": ["Elimina la necesidad de revisión por pares si se publica como preprint", "Solo debe comunicarse en un único formato: el paper revisado por pares", "No debe compartirse como dataset abierto por razones de exclusividad", "Puede comunicarse en varios formatos distintos, dirigidos a audiencias diferentes"], "correct": 3, "exp": "El mismo hallazgo se comunica en varios formatos (paper, preprint, dataset, divulgación), cada uno para un público distinto."}, {"type": "single", "q": "El ciclo NASA (análisis → pre-print → peer review y publicación) es transferible a IS porque:", "options": ["Cada decisión analítica se documenta de forma reproducible antes de compartir resultados", "Solo aplica a experimentos controlados, nunca a estudios de caso", "Elimina la necesidad de revisión por pares en publicaciones IS", "Reemplaza por completo la necesidad de un protocolo de estudio de caso"], "correct": 0, "exp": "El principio transferible es la documentación reproducible previa a la difusión abierta de resultados."}, {"type": "single", "q": "Al aplicar codificación abierta a un fragmento de entrevista, la práctica correcta es asignar:", "options": ["Ningún código; solo un resumen narrativo", "Al menos 2 códigos por fragmento, con justificación", "Exactamente 5 códigos por fragmento, sin justificación", "Un solo código, sin necesidad de justificación"], "correct": 1, "exp": "La práctica correcta exige al menos 2 códigos por fragmento, cada uno justificado."}, {"type": "single", "q": "El flujo general de análisis de un estudio de caso sigue la secuencia:", "options": ["Codificación → temas → hallazgos → reporte", "Reporte → codificación → temas → hallazgos", "Temas → hallazgos → codificación → reporte", "Hallazgos → temas → codificación → reporte"], "correct": 0, "exp": "El flujo correcto es codificación, luego temas, luego hallazgos, luego reporte, sostenido por el audit trail."}, {"type": "single", "q": "Secuenciar explícitamente los pasos del análisis cualitativo (preparación, codificación, agrupación, interpretación, validación) tiene como propósito:", "options": ["Garantizar que el análisis sea sistemático, trazable y defendible", "Eliminar la necesidad de un audit trail adicional", "Facilitar exclusivamente el uso de un software específico", "Reducir el tiempo total de análisis a menos de una semana"], "correct": 0, "exp": "El propósito de secuenciar los pasos es asegurar un análisis sistemático, trazable y defendible ante la comunidad académica."}, {"type": "single", "q": "Un investigador reporta un hallazgo basado en un único fragmento aislado de una entrevista, sin ninguna otra evidencia que lo respalde. Este hallazgo:", "options": ["Es válido siempre que se calcule su Cohen's Kappa correspondiente", "Es válido si el fragmento proviene del participante con mayor cargo jerárquico", "No cumple con la regla de oro, que exige al menos 3 instancias de fuentes diferentes", "Cumple con la regla de oro del análisis temático, que exige múltiples instancias"], "correct": 2, "exp": "Un solo fragmento no cumple la regla de oro de al menos 3 instancias de evidencia de fuentes diferentes."}]}, {"key": "ec17", "title": "Clase 17 · Estudios de Caso en IS: Problemas Reales", "group": "Estudios de Caso", "questions": [{"type": "single", "q": "En el caso Ericsson (Jonsson et al., 2022) sobre asignación automática de bugs, el hallazgo principal fue que:", "options": ["El machine learning nunca debe usarse para asignar bugs", "La precisión técnica del modelo (>80%) fue suficiente por sí sola para garantizar la adopción", "Los ingenieros aceptaron todas las sugerencias del modelo sin importar su precisión", "Factores organizacionales y de confianza fueron determinantes más allá de la precisión técnica"], "correct": 3, "exp": "La precisión técnica no bastó; los factores organizacionales y de confianza fueron determinantes."}, {"type": "single", "q": "El diseño del caso Ericsson se clasifica como:", "options": ["Longitudinal y explicativo, caso único embebido", "Descriptivo, mediante encuesta a gran escala", "Exploratorio, caso múltiple holístico entre varias empresas", "Experimento controlado con asignación aleatoria de bugs"], "correct": 0, "exp": "Es longitudinal y explicativo, caso único embebido con equipos de desarrollo como subunidades."}, {"type": "single", "q": "Al evaluar el caso Ericsson con el checklist de Rico (2024), la única debilidad señalada fue:", "options": ["Generalización limitada, por realizarse solo en una empresa", "No usar múltiples fuentes de evidencia", "No declarar el tipo de estudio", "No discutir la validez del estudio"], "correct": 0, "exp": "La debilidad señalada fue la generalización limitada por tratarse de un único caso empresarial."}, {"type": "single", "q": "GitClear (2024) reportó una reducción del cycle time con el uso de asistentes de IA; en contraste, DORA (2025) reportó:", "options": ["Un aumento proporcional en la satisfacción laboral", "La imposibilidad de medir cualquier efecto de la IA en el código", "Una reducción idéntica del cycle time, confirmando el hallazgo", "Deuda técnica inducida que compromete la mantenibilidad a largo plazo"], "correct": 3, "exp": "DORA (2025) reporta deuda técnica inducida como contrapeso al hallazgo de velocidad de GitClear."}, {"type": "single", "q": "El caso de Copilot en equipos ágiles es metodológicamente relevante para IS principalmente porque:", "options": ["Fue financiado directamente por una universidad pública", "Se realizó exclusivamente en condiciones de laboratorio", "Es un fenómeno contemporáneo en contexto real, difícil de aislar en un experimento controlado", "No involucra desarrolladores humanos, solo métricas automáticas"], "correct": 2, "exp": "Su relevancia se justifica por ser un fenómeno contemporáneo en contexto real, imposible de aislar completamente."}, {"type": "single", "q": "El caso NASA GeneLab se clasifica según Stake (1995) como:", "options": ["No es un estudio de caso, sino un experimento de simulación", "Caso múltiple colectivo, instrumental para entender la ciencia abierta reproducible", "Caso intrínseco, por el interés propio de cada misión espacial", "Caso único holístico, sin subunidades de análisis"], "correct": 1, "exp": "Es un caso múltiple colectivo, instrumental para entender la ciencia abierta reproducible."}, {"type": "single", "q": "Al evaluar el caso GeneLab con el checklist de Rico (2024), la amenaza a la validez mencionada explícitamente fue:", "options": ["Falta de acceso a los datos originales", "Conflicto de interés no declarado", "Sesgo de selección de investigadores voluntarios", "Ausencia total de documentación de protocolos"], "correct": 2, "exp": "La amenaza señalada y reconocida en el caso fue el sesgo de selección de investigadores voluntarios."}, {"type": "single", "q": "En el caso de adopción de IA en empresas latinoamericanas (2024), el NDA firmado con la empresa tuvo como efecto:", "options": ["Permitir acceso profundo pero limitar la especificidad del reporte final", "Impedir por completo la publicación del estudio", "No tuvo ningún impacto sobre el reporte del estudio", "Aplicar únicamente a estudios de caso cuantitativos"], "correct": 0, "exp": "El NDA ilustra la tensión entre acceso profundo y transparencia académica limitada."}, {"type": "single", "q": "En el caso IA-Latinoamérica, la barrera con frecuencia 'alta', complementada con observación de reuniones, fue:", "options": ["Resistencia organizacional", "Brecha de competencias técnicas", "Falta de datos de calidad", "Todas tuvieron frecuencia media"], "correct": 0, "exp": "La resistencia organizacional se registró con frecuencia alta, complementada con observación de reuniones."}, {"type": "single", "q": "Al comparar varios casos reales con el checklist de Rico (2024), el patrón general que emerge es que:", "options": ["Solo un caso cumple algún criterio del checklist", "Los estudios industriales cumplen mejor todos los criterios por tener más recursos", "Los estudios industriales son más débiles en clasificación y amenazas a la validez que los académicos revisados por pares", "No existe ningún patrón; todos los casos cumplen exactamente igual"], "correct": 2, "exp": "Los estudios industriales resultan más débiles en clasificación y amenazas a la validez que los académicos formales."}, {"type": "single", "q": "Al evaluar la viabilidad de un caso propio, los 4 factores clave a considerar son:", "options": ["Tamaño de muestra, potencia estadística, significancia, tamaño del efecto", "Presupuesto, tecnología, idioma, ubicación geográfica", "Aleatorización, control, validez interna, validez externa", "Acceso, tiempo, ética, relevancia"], "correct": 3, "exp": "Los 4 factores de viabilidad son acceso, tiempo, ética y relevancia."}, {"type": "single", "q": "Sobre el mito 'no se puede generalizar de un caso', la posición correcta según Yin (2014) es:", "options": ["El mito es correcto: los estudios de caso nunca aspiran a generalización", "Solo es un mito en casos únicos, no en casos múltiples", "Es un mito: se generaliza teóricamente, no estadísticamente", "La generalización solo es válida si el estudio incluye análisis cuantitativo"], "correct": 2, "exp": "La generalización en estudios de caso es teórica/analítica, no estadística; el mito queda desmentido."}, {"type": "single", "q": "Sobre el mito 'el estudio de caso es fácil porque no requiere estadística', la respuesta correcta es:", "options": ["Es un mito, porque de hecho siempre requiere pruebas estadísticas inferenciales", "Es un mito: requiere igual rigor que el experimento, de un tipo diferente", "Es correcto: los estudios de caso no requieren ningún tipo de rigor formal", "Es correcto, pero solo aplica a estudios exploratorios"], "correct": 1, "exp": "El estudio de caso exige igual rigor, con herramientas propias (protocolo, triangulación, validez, audit trail)."}, {"type": "single", "q": "En la línea de tiempo del rigor en estudios de caso IS, el estudio Ericsson con pre-registro corresponde al año:", "options": ["2024", "2009", "2025", "2022"], "correct": 3, "exp": "El estudio Ericsson con pre-registro se ubica en 2022, entre Runeson & Höst (2009) y Rico (2024)."}, {"type": "single", "q": "En los criterios de evaluación de un proyecto de estudio de caso, el porcentaje asignado a 'rigor metodológico' es:", "options": ["10%", "40%", "20%", "30%"], "correct": 1, "exp": "El rigor metodológico recibe el mayor peso relativo, 40%, sobre pertinencia (30%), análisis (20%) y claridad (10%)."}, {"type": "single", "q": "En un análisis simulado de estudio de caso como entregable, el requisito de fragmentos codificados con temas emergentes es de:", "options": ["Al menos 10 fragmentos", "3 fragmentos", "Ningún fragmento; solo un resumen narrativo", "Un cálculo de Cohen's Kappa entre codificadores independientes"], "correct": 1, "exp": "El requisito específico es de 3 fragmentos codificados con sus temas emergentes."}, {"type": "single", "q": "Entre las preguntas IS sin respuesta en el contexto ecuatoriano señaladas como posibles casos propios, se incluye:", "options": ["¿Qué barreras enfrentan los equipos locales al implementar DevSecOps?", "¿Qué porcentaje de empresas ecuatorianas cotiza en bolsa?", "¿Cuál es el lenguaje de programación más usado en Ecuador?", "¿Cuánto cuesta en promedio contratar un desarrollador senior en Quito?"], "correct": 0, "exp": "Esa pregunta sobre barreras de DevSecOps es una de las sugeridas explícitamente como caso propio."}, {"type": "single", "q": "Los casos reales analizados se evalúan aplicando principalmente:", "options": ["Un cálculo de significancia estadística sobre los hallazgos", "Un análisis gramatical del reporte publicado", "Las 5 fases del proceso experimental de Wohlin et al. (2012)", "El checklist de Rico (ICSE 2024)"], "correct": 3, "exp": "Los casos se evalúan aplicando el checklist de Rico (2024), propio de estudios de caso, no el marco experimental."}, {"type": "single", "q": "Los casos de Copilot (2024-2025) y adopción de IA en Latinoamérica (2024) muestran que la adopción tecnológica como fenómeno de estudio:", "options": ["Es un fenómeno histórico ya cerrado, sin relevancia actual", "Sigue siendo contemporáneo y merece estudio activo", "Dejó de publicarse en estudios de caso después de 2020", "Solo interesa a organizaciones grandes como la NASA"], "correct": 1, "exp": "Ambos casos recientes muestran que la adopción tecnológica sigue siendo un fenómeno contemporáneo vigente."}, {"type": "single", "q": "El rigor de un estudio de caso, según la síntesis de Yin (2014), proviene principalmente de:", "options": ["El tamaño de la muestra de entrevistados", "La estadística inferencial aplicada a los datos cualitativos", "La transparencia, la triangulación y la honestidad sobre las limitaciones", "El financiamiento institucional obtenido"], "correct": 2, "exp": "El rigor no viene de la estadística sino de la transparencia, triangulación y honestidad sobre las limitaciones."}]}, {"key": "ex13", "title": "Introducción a la Experimentación en Ingeniería de Software", "group": "Experimentación", "questions": [{"type": "single", "q": "Según Weinberg & Schulman, ¿en qué año se registra la primera referencia a experimentos controlados en IS (legibilidad de código)?", "options": ["1965", "1971", "1995", "1986"], "correct": 1, "exp": "1971 es la fecha citada como primera referencia a experimentos controlados en IS."}, {"type": "single", "q": "Un análisis de repositorios (MSR) que mina datos históricos sin manipular ninguna variable se clasifica como:", "options": ["Un experimento de simulación", "Un diseño factorial 2×2", "No es un experimento, al igual que un estudio de caso o una encuesta", "Un experimento cuasi-controlado"], "correct": 2, "exp": "MSR no manipula variables, por lo que no es un experimento, igual que estudio de caso o encuesta."}, {"type": "single", "q": "El primer experimento IS con diseño riguroso, que comparó inspección de código, pruebas funcionales y pruebas estructurales, fue realizado por:", "options": ["Shull et al. (2008)", "Wohlin et al. (2000)", "Weinberg & Schulman (1971)", "Basili & Selby (1986)"], "correct": 3, "exp": "Basili & Selby (1986) es el primer experimento IS con diseño riguroso; Weinberg & Schulman es solo la primera referencia."}, {"type": "single", "q": "El problema de reproducibilidad y las series de replicación multi-sitio en IS se ubican principalmente en la década de:", "options": ["1970s", "2000s", "1990s", "2010s"], "correct": 3, "exp": "Las series de replicación (Shull et al., 2008) y la crisis de reproducibilidad se ubican en los años 2010."}, {"type": "single", "q": "El cuasi-experimento se diferencia del experimento controlado principalmente porque:", "options": ["No mide ninguna variable dependiente", "Se ejecuta exclusivamente en condiciones de laboratorio", "No permite ningún control de variables de confusión", "No hay aleatorización completa; se usan grupos naturales ya existentes"], "correct": 3, "exp": "El cuasi-experimento sí mide variables y permite cierto control; lo distintivo es la falta de aleatorización completa."}, {"type": "single", "q": "Respecto al balance entre control y naturalismo en el diseño experimental, la relación correcta es:", "options": ["A mayor control, mayor validez externa; a mayor naturalismo, mayor certeza causal", "A mayor naturalismo, mayor control del entorno", "A mayor control, mayor validez interna; a mayor naturalismo, mayor validez externa", "El control y el naturalismo son completamente independientes entre sí"], "correct": 2, "exp": "Mayor control → validez interna (certeza causal); mayor naturalismo → validez externa (generalización)."}, {"type": "single", "q": "En un experimento que compara revisión de código con IA vs. manual, midiendo densidad de defectos, la variable dependiente es:", "options": ["La asignación aleatoria de participantes a grupos", "El tipo de revisión (IA vs. manual)", "La herramienta usada para medir (SonarQube)", "La densidad de defectos obtenida"], "correct": 3, "exp": "La variable dependiente es la densidad de defectos, lo que se mide como resultado; el tipo de revisión es la VI."}, {"type": "single", "q": "La pregunta '¿qué factores predicen los defectos en proyectos de código abierto?' se responde mejor con:", "options": ["Minería de repositorios (MSR)", "Estudio de caso", "Experimento controlado", "Cuasi-experimento"], "correct": 0, "exp": "Esa pregunta se responde minando datos históricos existentes, sin manipular variables, lo que corresponde a MSR."}, {"type": "single", "q": "Antes de su uso en el helicóptero Ingenuity en Marte, el software F Prime de la NASA fue sometido a:", "options": ["Únicamente revisión manual de código, sin pruebas automatizadas", "Encuestas de satisfacción a los ingenieros de vuelo", "Un estudio de caso longitudinal de 5 años en la Tierra", "Pruebas de regresión automatizadas e inyección de fallos"], "correct": 3, "exp": "F Prime fue validado con pruebas de regresión automatizadas, inyección de fallos y comparaciones entre versiones."}, {"type": "single", "q": "Los vuelos exitosos de Ingenuity en Marte se lograron:", "options": ["Sin posibilidad de intervención humana en tiempo real, dada la distancia Tierra-Marte", "Solo durante los primeros vuelos, luego se requirió intervención manual", "Mediante control remoto satelital continuo", "Con un operador humano controlando cada vuelo en tiempo real desde la Tierra"], "correct": 0, "exp": "La distancia Tierra-Marte hace imposible la intervención en tiempo real, de ahí la relevancia de la validación previa."}, {"type": "single", "q": "Frente a la escasez de sujetos representativos de la industria (estudiantes vs. profesionales), la solución propuesta es:", "options": ["Sustituir siempre a los sujetos humanos por modelos de IA", "Estudios multi-sitio y replicación con profesionales", "Cancelar el experimento si no se consiguen profesionales", "Usar exclusivamente profesores universitarios como sujetos"], "correct": 1, "exp": "La solución es realizar estudios multi-sitio y replicar posteriormente con profesionales."}, {"type": "single", "q": "El 'efecto Hawthorne' se refiere a que:", "options": ["La tendencia de revisores a rechazar resultados negativos", "Un error de medición exclusivo de instrumentos automáticos", "Los sujetos actúan distinto por saber que están siendo observados", "Un sesgo estadístico causado por muestras pequeñas"], "correct": 2, "exp": "Es la definición estándar: cambio de comportamiento por el hecho de saberse observado."}, {"type": "single", "q": "Respecto a la replicación de experimentos IS, la situación real de la disciplina es que:", "options": ["La mayoría se publican una sola vez y rara vez se replican", "La mayoría se replican sistemáticamente en al menos 3 sitios distintos", "La replicación es obligatoria por norma editorial en todas las revistas IS", "Solo los experimentos sobre TDD se replican de forma habitual"], "correct": 0, "exp": "El reto real es la escasa replicación, descrita como crisis de reproducibilidad."}, {"type": "single", "q": "Frente a variables de confusión como experiencia previa, fatiga o motivación, la solución metodológica adecuada es:", "options": ["Ignorarlas, ya que no afectan significativamente los resultados en IS", "Aleatorización, bloques y covariables", "Eliminar del estudio a cualquier sujeto con experiencia previa", "Sustituir siempre el experimento por una simulación sin sujetos humanos"], "correct": 1, "exp": "Las soluciones reales son aleatorización, bloques, covariables y diseños within-subject; ignorarlas no es válido."}, {"type": "single", "q": "Sobre la validez externa entre un experimento con estudiantes universitarios y otro con profesionales en empresa real:", "options": ["Ambos tienen automáticamente el mismo nivel de validez externa", "La validez externa no depende del tipo de sujetos, solo del tamaño de muestra", "Es un problema abierto, mitigado con series de replicación y estudios de campo", "El experimento con estudiantes siempre tiene mayor validez externa"], "correct": 2, "exp": "Es un problema abierto sin solución automática, mitigado con replicación y estudios de campo complementarios."}, {"type": "single", "q": "El principio transferible del caso F Prime a la investigación IS es que la validación experimental del software es:", "options": ["Innecesaria si ya existen pruebas de regresión", "Open Science aplicada a la ingeniería", "Opcional en software crítico si el presupuesto es limitado", "Exclusiva de organizaciones con grandes recursos como la NASA"], "correct": 1, "exp": "Es la cita textual: la validación experimental del software es Open Science aplicada a la ingeniería."}, {"type": "single", "q": "La pregunta '¿el pair programming mejora la satisfacción del desarrollador?' corresponde mejor a:", "options": ["Minería de repositorios (MSR)", "Cuasi-experimento o experimento controlado", "Encuesta exclusivamente", "Estudio de caso exploratorio exclusivamente"], "correct": 1, "exp": "Al poder manipularse la técnica de programación, corresponde a cuasi-experimento o experimento controlado."}, {"type": "single", "q": "Al evaluar críticamente el protocolo de un experimento publicado, la pregunta clave es:", "options": ["¿Cuál es la hipótesis nula y la alternativa?", "¿Cómo se asignaron los sujetos a los grupos?", "¿Hay algo en el protocolo que impida reproducir el experimento mentalmente?", "¿Cuál es la variable independiente y la dependiente?"], "correct": 2, "exp": "La evaluación crítica del protocolo se centra en identificar ambigüedades que impidan su reproducción, más allá de solo identificar variables o hipótesis."}, {"type": "single", "q": "Comparado con el debate basado en experiencia personal, un experimento aporta principalmente:", "options": ["Una respuesta con matices, en lugar de un debate que permanece infinito", "La eliminación completa de cualquier desacuerdo futuro entre expertos", "Una opinión adicional, con el mismo peso que la experiencia personal", "Certeza absoluta e irrefutable sobre cualquier pregunta IS"], "correct": 0, "exp": "El experimento aporta una respuesta matizada, en contraste con el debate infinito basado en experiencia personal."}, {"type": "single", "q": "Un experimento controlado, a diferencia de un cuasi-experimento, se caracteriza principalmente por:", "options": ["Contar con aleatorización completa de sujetos a los grupos", "Ejecutarse exclusivamente con datos históricos ya existentes", "No requerir ninguna variable dependiente", "No necesitar ningún tipo de control de variables de confusión"], "correct": 0, "exp": "La aleatorización completa es lo que distingue al experimento controlado del cuasi-experimento."}]}, {"key": "ex14", "title": "Diseño y Planificación del Experimento en IS", "group": "Experimentación", "questions": [{"type": "single", "q": "Según Hannay et al. (2013), sobre 113 experimentos IS publicados en ICSE y FSE, el porcentaje que no reportaba el tamaño del efecto (solo el p-valor) fue:", "options": ["19%", "27%", "38%", "60%"], "correct": 0, "exp": "La cifra reportada por Hannay et al. (2013) para esa omisión específica es 19%."}, {"type": "single", "q": "Según Wohlin et al. (2012), un experimento mal diseñado:", "options": ["No puede salvarse con un buen análisis estadístico posterior", "Puede salvarse con un buen análisis estadístico posterior", "Solo se salva aumentando el tamaño de muestra durante el análisis", "Se salva reformulando la hipótesis después de ver los datos"], "correct": 0, "exp": "Un mal diseño no se compensa con un análisis posterior, por bueno que sea."}, {"type": "single", "q": "De los 5 componentes del diseño experimental, el que responde a '¿cómo asigno sujetos y tratamientos?' es:", "options": ["Hipótesis", "Diseño", "Objetivo (GQM)", "Instrumentos"], "correct": 1, "exp": "El componente 'Diseño' responde específicamente esa pregunta de asignación."}, {"type": "single", "q": "Según la plantilla GQM (Basili et al., 1994), el orden correcto de la estructura del objetivo es:", "options": ["Hipótesis → Variables → Diseño → Instrumentos", "Contexto → Perspectiva → Intención → Objeto", "Métrica → Pregunta → Objetivo", "Analizar [objeto] → con el propósito de [intención] → con respecto a [aspecto de calidad] → desde [perspectiva] → en el contexto de [entorno]"], "correct": 3, "exp": "Ese es el orden exacto de la plantilla GQM: Analizar, propósito, aspecto de calidad, perspectiva, contexto."}, {"type": "single", "q": "La hipótesis nula (H0) en un experimento IS afirma que:", "options": ["No existe diferencia ni efecto entre los grupos comparados", "El tamaño del efecto es necesariamente grande", "Existe una diferencia significativa entre los grupos", "La variable dependiente causa cambios en la independiente"], "correct": 0, "exp": "H0 afirma ausencia de diferencia o efecto; la existencia de diferencia corresponde a H1."}, {"type": "single", "q": "Según el criterio de Popper, una hipótesis científica debe ser, ante todo:", "options": ["Formulada después de observar los datos", "Falsificable con datos", "Redactada exclusivamente en forma direccional", "Acompañada de un intervalo de confianza del 99%"], "correct": 1, "exp": "La falsabilidad (Popper) es el criterio de cientificidad de una hipótesis."}, {"type": "single", "q": "Formular la hipótesis después de observar los datos, pero presentarla como si hubiera sido definida a priori, se conoce como:", "options": ["Triangulación metodológica", "Validación cruzada", "HARKing", "Contrabalanceo"], "correct": 2, "exp": "Esa práctica se denomina HARKing (Hypothesizing After Results are Known)."}, {"type": "single", "q": "En la tabla de tipos de variables, 'experiencia previa del desarrollador' se clasifica típicamente como una variable:", "options": ["Dependiente (VD)", "Independiente (VI)", "De confusión", "Controlada"], "correct": 2, "exp": "Es un ejemplo clásico de variable de confusión: afecta la VD pero no se controla deliberadamente."}, {"type": "single", "q": "Operacionalizar la variable 'densidad de defectos' significa:", "options": ["Asignarla aleatoriamente a los grupos de tratamiento", "Dar una definición exacta de cómo se mide", "Convertirla en una variable cualitativa", "Eliminarla del diseño por ser difícil de medir"], "correct": 1, "exp": "Operacionalizar es dar una definición operativa exacta y verificable de la medición."}, {"type": "single", "q": "Un diseño factorial 2×2 (TDD vs. tradicional; pair vs. solo programming) permite detectar principalmente:", "options": ["Únicamente el efecto principal de un solo factor a la vez", "La eliminación completa de la necesidad de aleatorización", "Interacciones entre los dos factores estudiados", "Una reducción a la mitad del número de sujetos necesarios"], "correct": 2, "exp": "La ventaja distintiva del diseño factorial es detectar interacciones entre factores."}, {"type": "single", "q": "En un diseño within-subject, el riesgo de efecto de aprendizaje o fatiga se mitiga principalmente mediante:", "options": ["Aumentar el tamaño de muestra", "Eliminar el grupo control", "Aplicar únicamente pruebas paramétricas", "Contrabalanceo del orden de los tratamientos"], "correct": 3, "exp": "El contrabalanceo del orden es la técnica específica para mitigar el efecto de aprendizaje o fatiga en within-subject."}, {"type": "single", "q": "Según Carver et al. (2010), la estrategia recomendada frente al dilema estudiantes vs. profesionales como sujetos es:", "options": ["Alternar aleatoriamente estudiantes y profesionales en el mismo grupo", "Comenzar con estudiantes para validar el diseño, y luego replicar con profesionales", "Usar exclusivamente profesionales desde el primer experimento", "Usar exclusivamente estudiantes, evitando la heterogeneidad de profesionales"], "correct": 1, "exp": "La estrategia de Carver et al. (2010) es estudiantes primero (validar diseño), profesionales después (validar generalización)."}, {"type": "single", "q": "El pre-registro del protocolo antes de reclutar sujetos tiene como función principal:", "options": ["Publicar anticipadamente el artículo final revisado por pares", "Ser un trámite administrativo sin relación con la calidad científica", "Evitar el ajuste post-hoc del diseño una vez conocidos los datos", "Sustituir por completo la necesidad de un comité de ética"], "correct": 2, "exp": "El pre-registro previene el ajuste del diseño después de conocer los datos (previene HARKing)."}, {"type": "single", "q": "La potencia estadística (β = 0.80) se define antes de recolectar datos porque un valor insuficiente incrementa el riesgo de:", "options": ["Error tipo I (falso positivo)", "Sobreestimar el tamaño del efecto", "p-hacking automático", "Error tipo II (no detectar un efecto real)"], "correct": 3, "exp": "Potencia insuficiente aumenta el riesgo de error tipo II, no detectar un efecto que sí existe."}, {"type": "single", "q": "Definir el plan de análisis estadístico antes de recolectar los datos, en lugar de después, sirve principalmente para evitar:", "options": ["El cálculo del tamaño del efecto", "El p-hacking: probar múltiples análisis hasta encontrar p < 0.05", "El aumento innecesario del tamaño de muestra", "La necesidad de verificar supuestos de normalidad"], "correct": 1, "exp": "Definir el análisis antes previene el p-hacking; hacerlo después es precisamente el riesgo que se evita."}, {"type": "single", "q": "La herramienta específica mencionada para el cálculo de potencia estadística y tamaño de muestra es:", "options": ["R", "SonarQube", "JASP", "G*Power"], "correct": 3, "exp": "G*Power es la herramienta específica para cálculo de potencia; JASP y R se usan para análisis y scripting, respectivamente."}, {"type": "single", "q": "Al justificar el componente 'Diseño' en un protocolo experimental, el estudiante debe indicar principalmente:", "options": ["La cadena de evidencia (audit trail) del estudio", "El nivel de significancia (α) que usará", "Si el diseño será between-subject o within-subject, y por qué", "El software de análisis cualitativo que empleará"], "correct": 2, "exp": "El componente 'Diseño' exige justificar la elección entre between-subject y within-subject."}, {"type": "single", "q": "El diseño de bloques aleatorizados, que agrupa sujetos similares antes de aleatorizar dentro de cada bloque, tiene como propósito principal:", "options": ["Eliminar por completo la necesidad de un grupo control", "Detectar interacciones entre múltiples factores", "Aumentar artificialmente el tamaño de la muestra", "Reducir el efecto de la variabilidad entre sujetos"], "correct": 3, "exp": "Agrupar sujetos similares en bloques reduce el ruido causado por su variabilidad."}, {"type": "single", "q": "La limitación específica de usar 'sistemas (objetos)' en lugar de personas como sujetos experimentales es que:", "options": ["No representan el factor humano, aunque no tienen fatiga ni sesgos cognitivos", "Tienen fatiga y sesgos cognitivos igual que los humanos", "Requieren consentimiento informado firmado, igual que los sujetos humanos", "Son más difíciles de conseguir que los desarrolladores profesionales"], "correct": 0, "exp": "Los sistemas/objetos no tienen fatiga ni sesgos, pero su limitación es no representar el factor humano."}, {"type": "single", "q": "Un componente del diseño experimental que queda sin definir antes de ejecutar el experimento representa principalmente:", "options": ["Una puerta abierta al sesgo, ya que las decisiones previas determinan qué preguntas puede responder el experimento", "Un ahorro de tiempo que no afecta la calidad del estudio", "Una decisión que puede resolverse fácilmente durante el análisis final", "Un problema exclusivamente administrativo sin relación con los resultados"], "correct": 0, "exp": "Las decisiones de diseño no definidas antes de ejecutar abren la puerta al sesgo, ya que determinan qué puede responder el experimento."}]}, {"key": "ex15", "title": "Ejecución y Recolección de Datos en Experimentos IS", "group": "Experimentación", "questions": [{"type": "single", "q": "Según Kitchenham et al. (2009), el porcentaje de 103 experimentos IS publicados que describía el procedimiento con suficiente detalle para ser replicado fue:", "options": ["69%", "50%", "31%", "80%"], "correct": 2, "exp": "La cifra citada es 31%; el resto era irreproducible principalmente por documentación deficiente."}, {"type": "single", "q": "El 69% de experimentos irreproducibles según Kitchenham et al. (2009) lo eran principalmente por:", "options": ["Uso de pruebas estadísticas incorrectas", "Ausencia total de hipótesis formuladas", "Manipulación fraudulenta de los datos", "Documentación deficiente del procedimiento"], "correct": 3, "exp": "La causa fue documentación deficiente, no fraude ni mala ciencia."}, {"type": "single", "q": "El estudio piloto, ejecutado con 2-3 sujetos antes del experimento real, tiene como fin:", "options": ["Sustituir la aleatorización formal del experimento", "Identificar ambigüedades del protocolo y problemas con instrumentos", "Calcular el tamaño del efecto preliminar del estudio", "Reclutar sujetos adicionales para el experimento final"], "correct": 1, "exp": "El piloto detecta problemas del protocolo antes de la ejecución real; sus datos no se incluyen en el análisis final."}, {"type": "single", "q": "Sobre el consentimiento informado, la práctica correcta es que los participantes conozcan:", "options": ["Nada del estudio hasta que este haya finalizado", "Únicamente el nombre del investigador principal", "El propósito general del estudio, sin revelar necesariamente la hipótesis si eso genera sesgo", "La hipótesis exacta del estudio antes de participar"], "correct": 2, "exp": "Se debe informar el propósito general, sin revelar la hipótesis específica si eso puede sesgar el comportamiento."}, {"type": "single", "q": "Un experimento IS bien diseñado, respecto a los instrumentos de recolección, debe:", "options": ["Usar exclusivamente cuestionarios subjetivos", "Evitar cualquier instrumento que requiera intervención humana", "Usar exclusivamente métricas automáticas objetivas", "Combinar al menos una métrica objetiva y una subjetiva"], "correct": 3, "exp": "La regla clave es combinar métricas objetivas y subjetivas para triangular el efecto del tratamiento."}, {"type": "single", "q": "El instrumento NASA-TLX mide específicamente:", "options": ["La complejidad ciclomática del sistema evaluado", "La cobertura de pruebas del código generado", "El tiempo de tarea mediante
