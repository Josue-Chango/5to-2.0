services:
  # 1. El Sensor (Vigila el sistema operativo Ubuntu)
  node_exporter:
    image: prom/node-exporter:latest
    container_name: sensor_ubuntu
    restart: unless-stopped
    ports:
      - "9100:9100"
# 2. El Recolector (Guarda el historial de métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: recolector_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Conectamos el archivo que creamos antes hacia adentro del contenedor
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # 3. El Visualizador (La interfaz gráfica)
  grafana:
    image: grafana/grafana:latest
    container_name: panel_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
  